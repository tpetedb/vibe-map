# Vibe Code Camp, journey configuration: who you are, how hard, the
# theme, the vault. Every key has a default; delete the file and
# `just start` still works. Unknown keys are refused. The game's own
# configuration is src/config/, see docs/CONFIG.md.

[learner]
name = "<your_name>"
persona = "chief-of-staff"  # chief-of-staff | cleaning-ceo | university-md | pabo-teacher | data-engineer | interior-stylist
difficulty = "normal"  # beginner | easy | normal | hard | expert | god
mode = "campaign"  # campaign (four evenings) | roadmap (the tech tree as quests)
provider = "claude"  # claude | codex | gemini | copilot | opencode

[theme]
preset = "studio"  # studio | wine-night | boardroom | seminar | field-guide | a name in themes/

[finale]
dates = [
  "Friday 25 September",
  "Saturday 3 October",
  "Friday 9 October",
  "Saturday 17 October",
  "Friday 23 October",
  "Another slot, I will circle back with Tom",
]

[game]
repo_url = "https://github.com/tpetedb/vibe-map"
shadow_map = 2048  # drop to 1024 if a phone stutters

[vault]
path = "vault"
folder = "Camp"
mode = "full"  # full (every note from day one) | grow (notes unlock as you play)

[news]  # the live world feed; empty feeds means the source registry
live = true  # false hides every feed-driven element in the game
feeds = []
per_feed = 8

[pet]  # the terminal companion; empty means what your name rolled
enabled = true
species = ""  # duck | goose | blob | cat | dragon | octopus | owl | penguin | turtle | snail | ghost | axolotl | capybara | cactus | robot | rabbit | mushroom | chonk | crab
name = ""
eye = ""  # one of: · * × ◉ @ °
hat = ""  # none | crown | tophat | propeller | halo | wizard | beanie | tinyduck
style = "auto"  # auto | pixel | ascii; pixel sprites for crab, duck, turtle and snail
