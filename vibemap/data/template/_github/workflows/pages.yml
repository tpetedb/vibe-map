# Workstream 7, Go-to-Market: publish your game from workspace/game/index.html
# at https://<you>.github.io/<repo>/. Switch Pages on once (Settings, Pages,
# Source: GitHub Actions); every push to main redeploys.
#
# Pages from a PRIVATE repository needs GitHub Pro or above: on GitHub Free the
# repository has to be public. README.md has the table of what else changes.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Your game is the front page
        run: |
          mkdir -p site
          cp workspace/game/index.html site/index.html
      # Your fork of the camp game, if you built one and committed it.
      - name: Your fork at /fork/
        run: |
          fork=workspace/forks/vibe-map/game/vibe-map.html
          if [ -f "$fork" ]; then
            mkdir -p site/fork
            cp "$fork" site/fork/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
