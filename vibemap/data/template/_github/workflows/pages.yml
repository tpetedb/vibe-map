# Workstream 7, Go-to-Market: publish your game from workspace/game/index.html
# at https://<you>.github.io/<repo>/. Switch Pages on once (Settings, Pages,
# Source: GitHub Actions); every push to main redeploys.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Your game is the front page
        run: |
          mkdir -p site
          cp workspace/game/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
