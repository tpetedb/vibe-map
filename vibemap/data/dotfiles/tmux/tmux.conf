# tmux.conf: Vibe Code Camp's terminal multiplexer setup.
# Adapted from Tom's Toolbox (github.com/tpetedb/toms-toolbox, MIT). What you
# get: true colour, the mouse, windows counted from 1, a bottom status bar in
# the palette (session, venv, branch, path, clock), panes on j/k/i/l (left,
# down, up, right: an inverted T, the same directions as AeroSpace) and
# prefix r to reload. The prefix stays Ctrl-b.
# Installed to ~/.config/tmux/tmux.conf by `vibe dotfiles install tmux`.

# -- Palette (user options; change a hex here to repaint the bar) -------------
set -g @vibe_bg     "#000000"
set -g @vibe_fg     "#CCCCCC"
set -g @vibe_muted  "#6A6A6A"
set -g @vibe_red    "#D32F2F"
set -g @vibe_orange "#FF8C1A"
set -g @vibe_yellow "#FFBF00"
set -g @vibe_green  "#00A86B"
set -g @vibe_blue   "#0067A5"

# -- True colour ---------------------------------------------------------------
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# -- Behaviour ---------------------------------------------------------------
set -g  mouse on
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -sg escape-time 10
set -g  history-limit 50000
set -g  set-clipboard on
set -g  focus-events on
set -g  display-time 2000
set -g  allow-passthrough on
set -s  extended-keys on
set -as terminal-features "xterm*:extkeys"

# -- Status bar at the bottom ---------------------------------------------------
set -g  status on
set -g  status-position bottom
set -g  status-interval 5
set -g  status-justify left
set -g  status-style "bg=#{@vibe_bg},fg=#{@vibe_fg}"
set -g  status-left-length  40
set -g  status-right-length 120
set -g  status-left "#[fg=#{@vibe_bg},bg=#{@vibe_green},bold] #S #[default] #{?client_prefix,#[fg=#{@vibe_red},bold]prefix #[default],}"
set -g  window-status-separator ""
set -g  window-status-format         "#[fg=#{@vibe_muted}] #I #W "
set -g  window-status-current-format "#[fg=#{@vibe_bg},bg=#{@vibe_orange},bold] #I #W "
set -g  status-right "#[fg=#{@vibe_blue}] #{b:pane_current_path} #[fg=#{@vibe_bg},bg=#{@vibe_yellow},bold] %H:%M #[fg=#{@vibe_bg},bg=#{@vibe_blue}] #h "
set -g  pane-border-style        "fg=#{@vibe_muted}"
set -g  pane-active-border-style "fg=#{@vibe_green}"
set -g  message-style            "fg=#{@vibe_bg},bg=#{@vibe_orange},bold"
set -g  mode-style               "fg=#{@vibe_bg},bg=#{@vibe_yellow},bold"

# -- Keys -------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind j select-pane -L
bind k select-pane -D
bind i select-pane -U
bind l select-pane -R
