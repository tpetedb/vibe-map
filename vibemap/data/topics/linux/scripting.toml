# Shell scripts that fail loudly. Written from the official docs, nothing from memory.
id = "scripting"
title = "Shell scripts that fail loudly"
age = "feudal"
shelf = "shell"
depth = 2
# The day every source below was read. Move it when you check them again.
checked = 2026-09-23
minutes = 20

summary = '''A shell script keeps running after a command fails unless you tell it not to. Three options change it: set -e stops at the first failing command, set -u refuses a variable that was never set, and set -o pipefail makes a pipeline fail when any command in it fails. Add quoting, so "$@" hands every argument through whole, and a trap that cleans up on EXIT, and a script says when it goes wrong. Reach for this the moment a script does more than one thing, and run ShellCheck over it.'''
for_agents = '''And for an agent: start every bash script with set -euo pipefail, quote every expansion, and run shellcheck on it before calling it done.'''

history = '''POSIX.1-2024 describes -e this way: "when any command fails (for any of the reasons listed in 2.8.1 Consequences of Shell Errors or by returning an exit status greater than zero), the shell immediately shall exit", with exceptions such as the condition of an if or any command of an AND-OR list other than the last. With -u, expanding an unset parameter makes the shell "write a message to standard error and the expansion shall fail". The pipefail option was added in this edition of the standard: it derives the exit status of a pipeline "from the exit statuses of all of the commands in the pipeline, not just the last (rightmost) command". A trap on EXIT runs "when the shell terminates normally (exits)", and the value of $? after the trap is the value it had before. ShellCheck is a GPLv3 tool that gives warnings and suggestions for bash and sh scripts, and the gallery of bad code in its README opens with quoting, an unquoted variable and an unquoted $@ among the examples.'''

try_it = '''Write safe.sh with #!/usr/bin/env bash, set -euo pipefail, trap 'echo "cleanup ran" >&2' EXIT, a function greet() { printf 'hello, %s\n' "$1"; } and a loop for name in "$@"; do greet "$name"; done. Run bash safe.sh "Ada Lovelace" > out.txt, then shellcheck safe.sh.'''

unlocks = ["cron", "systemd"]
prerequisites = ["bash", "texttools"]

[[origins]]
place = "a-standards-body"
year = 2024
what = "The IEEE and The Open Group publish POSIX.1-2024, whose shell command language adds set -o pipefail."
source = "https://pubs.opengroup.org/onlinepubs/9799919799/utilities/V3_chap02.html"
primary = true

[[sources]]
label = "POSIX.1-2024, Shell Command Language (set, trap, pipelines, exit status)"
url = "https://pubs.opengroup.org/onlinepubs/9799919799/utilities/V3_chap02.html"
checked = 2026-09-23

[[sources]]
label = "ShellCheck, a shell script static analysis tool"
url = "https://github.com/koalaman/shellcheck"
checked = 2026-09-23

[[sources]]
label = "GNU bash manual page, the set builtin and EXIT STATUS (Debian)"
url = "https://manpages.debian.org/bookworm/bash/bash.1.en.html"
checked = 2026-09-23

# The hands-on: a folder in the workspace and one offline check.
[hands_on]
title = "A script that stops at the first failure"
minutes = 20
done = "safe.sh sets -euo pipefail, traps EXIT and passes \"$@\" through whole, and out.txt greets Ada Lovelace in one line"
check = { kind = "files", files = { "safe.sh" = ["set -euo pipefail", "trap ", "\"$@\""], "out.txt" = ["hello, Ada Lovelace"] } }
