year = 2024
what = "POSIX.1-2024, IEEE Std 1003.1-2024, specifies the crontab entry format: five time fields and a command run by sh, based on the System V crontab."
source = "https://pubs.opengroup.org/onlinepubs/9799919799/utilities/crontab.html"
primary = true

