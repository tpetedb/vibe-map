# Text tools, grep, sed and awk. Written from the official docs, nothing from memory.
id = "texttools"
title = "Text tools, grep, sed and awk"
age = "dark"
shelf = "shell"
depth = 2
# The day every source below was read. Move it when you check them again.
checked = 2026-09-23
minutes = 20

summary = '''grep, sed, awk, cut, sort and uniq are small programs that each do one thing to lines of text, and a pipe joins them into a report without a line of code. grep selects the lines that match a pattern, sed edits a stream, awk runs a little program over records and fields, cut takes columns out, and uniq collapses repeated adjacent lines. Reach for them when a log, a CSV or the output of another command has the answer in it and you want it in a minute, not after writing a script.'''
for_agents = '''And for an agent: uniq only compares adjacent lines, so sort before uniq, and count with grep -c rather than piping to wc when the question is how many lines match.'''

history = '''The Seventh Edition of Unix, released by Bell Laboratories in January 1979, is where awk and sed arrived among "many new applications". The grep utility "shall search the input files, selecting lines matching one or more patterns", and grep -c writes "only a count of selected lines". The sed utility "is a stream editor that shall read one or more text files, make editing changes according to a script of editing commands, and write the results to standard output." An awk program "is a sequence of patterns and corresponding actions", and by default a record is a line. uniq writes "one copy of each input line" but compares only adjacent lines, and uniq -c puts the number of times each line occurred in front of it.'''

try_it = '''printf 'ada,3\nbob,5\nada,4\ncy,1\n' > runs.csv, then cut -d, -f1 runs.csv | sort | uniq -c | sort -rn | head -1 > report.txt, then awk -F, '{ total += $2 } END { print "total", total }' runs.csv >> report.txt, then sed -n 's/^bob,/best: bob /p' runs.csv >> report.txt.'''

unlocks = ["scripting"]
prerequisites = ["bash"]

