# The filesystem and permissions. Written from the official docs, nothing from memory.
id = "permissions"
title = "The filesystem and permissions"
age = "dark"
shelf = "shell"
depth = 1
# The day every source below was read. Move it when you check them again.
checked = 2026-09-23
minutes = 15

summary = '''A Linux machine keeps its files in one agreed tree, and every file in it carries three sets of permissions: for its owner, for the other users in its group, and for everyone else. The tree is written down in the Filesystem Hierarchy Standard, which is why configuration sits under /etc, logs under /var/log and your own files under /home. Reach for this topic when a script says "Permission denied", when a key file has to be readable by you alone, or when you wonder where a program keeps its settings.'''
for_agents = '''And for an agent: set a mode with the octal number you mean (chmod 640, chmod 755) rather than guessing with +x or +w, and say which of the three categories the change is for.'''

history = '''The Filesystem Hierarchy Standard, version 3.0, published by the LSB Workgroup of The Linux Foundation on March 19, 2015, "consists of a set of requirements and guidelines for file and directory placement under UNIX-like operating systems." It names each directory for its job: /etc for host-specific system configuration, /home for user home directories, /tmp for temporary files, /var/log for log files and directories. In the GNU coreutils manual there are three kinds of permission, read, write and execute, and three categories of users who may hold them: the file's owner, other users who are in the file's group, and everyone else. As a number each category takes one octal digit, read 4, write 2 and execute 1, so mode 664 is the same as the symbolic mode ug=rw,o=r. The umask removes permissions you did not mean to give away, and "its default value varies from system to system".'''

try_it = '''touch secret.txt, chmod 640 secret.txt, then ls -l secret.txt > perms.txt: the owner may read and write, the group may read, everyone else gets nothing.'''

unlocks = ["processes", "scripting"]
prerequisites = ["kernel", "files"]

