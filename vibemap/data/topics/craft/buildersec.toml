# The hands-on: a folder in the workspace and one offline check.
[hands_on]
title = "A key that never touches the code"
minutes = 15
done = ".gitignore lists .env, and app.py reads API_KEY from the environment with no key written in it"
check = { kind = "files", files = { ".gitignore" = [".env"], "app.py" = ["os.environ", "API_KEY"] }, absent = { "app.py" = ["API_KEY = \"", "API_KEY=\"", "API_KEY = '"] } }
