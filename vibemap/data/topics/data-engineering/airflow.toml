# The hands-on: a folder in the workspace and one offline check.
[hands_on]
title = "A DAG the real library agrees is a DAG"
minutes = 18
done = "camp_dag.py parses with airflow and reports its tasks, its schedule and its edges"
check = { kind = "module", file = "camp_dag.py", modules = [
  "airflow",
], install = "uv add 'apache-airflow==3.3.2'", contains = [
  "airflow.sdk",
  "schedule",
], prints = [
  "dag: camp_scores",
  "schedule: @daily",
  "tasks: ['extract', 'load', 'transform']",
  "after extract: ['transform']",
  "roots: ['extract']",
] }
