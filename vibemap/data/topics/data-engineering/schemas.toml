minutes = 18
done = "schema_drift.py shows position-based reading refused and union_by_name healing it"
check = { kind = "script", file = "schema_drift.py", contains = [
  "union_by_name",
  "coalesce",
], prints = [
  "by position: refused",
  "holes: 3",
  "healed: [('ada', 340), ('tom', 120)]",
] }
