# The hands-on: a folder in the workspace and one offline check.
[hands_on]
title = "A catalog in SQLite, two snapshots, and a read of the older one"
minutes = 18
done = "iceberg_timetravel.py appends twice, then reads the table as it was after the first append"
check = { kind = "module", file = "iceberg_timetravel.py", modules = [
  "pyiceberg",
  "pyarrow",
], install = "uv add 'pyiceberg[sql-sqlite,pyarrow]'", contains = [
  "SqlCatalog",
  "snapshot_id",
], prints = [
  "snapshots: 2",
  "now: 2",
  "then: 1",
  "columns: 3",
  "still: 2",
] }
