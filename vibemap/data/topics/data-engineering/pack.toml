# The data engineering pack
id = "data-engineering"
title = "The data engineering pack"
blurb = "Sixteen topics that read as one path: the file formats data arrives in, the table formats it rests in, the tools that ingest it, transform it, schedule it and test it, and the map that says which of those three any tool is doing. Everything runs on a laptop with uv, with no account and no paid service."
shelf = "data"
order = 10
maintainer = "Every topic was written from the project's own documentation, fetched the day the topic records under checked, and every hands-on was run before it landed: the folder built, the commands run, the check confirmed green on the result and red on an empty folder. Where a tool was too heavy for twenty minutes on a laptop, the topic says so with the measurement and the exercise is the lighter honest version rather than a pretence. Extend the core topics sql and data by linking to them; never copy them."

