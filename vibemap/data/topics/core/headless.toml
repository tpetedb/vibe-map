# Headless agents and scheduling. Regenerate the tree after editing: just tree
id = "headless"
title = "Headless agents and scheduling"
age = "imperial"
shelf = "ship"
depth = 3

summary = "claude -p runs the agent as a command: prompt in, result out, no chat. Put it in launchd, cron, a GitHub Action or a webhook and you have automation that reasons. This is where the leverage is for a business: one boring job, done on a timer, forever."

history = "Cron is older than almost everything in this tree: its manual page is in Sixth Edition Unix, dated October 1974. The new part is that the scheduled job can now read a mailbox, decide, and write a note. Programmatic agents (2025) are the successor of the scheduled script."
try_it = "The 23:00 workstream: schedule the scorekeeper for 08:00."

unlocks = ["tests", "cost"]

