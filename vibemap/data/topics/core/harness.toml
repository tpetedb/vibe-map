summary = "Your standing instructions, per repo and per machine, in files the agent reads before it starts. AGENTS.md for every agent; CLAUDE.md importing it for Claude; .claude/settings.json for permissions and hooks; ~/.claude/ for personal defaults. This is your operating model, versioned."

history = "Cursor's rules files came first, then CLAUDE.md with Claude Code (February 2025) and AGENTS.md (August 2025, stewarded since December 2025 by the Agentic AI Foundation under the Linux Foundation). In one year instruction files went from a hack to a standard read by dozens of tools and used in tens of thousands of repos."
try_it = "Edit AGENTS.md, add 'always end with one line: what changed'. Next session, check it does."

unlocks = ["skills", "hooks", "mcp"]

