# SQL and DuckDB. Regenerate the tree after editing: just tree
id = "sql"
title = "SQL and DuckDB"
age = "feudal"
shelf = "data"
depth = 2

summary = "SQL asks questions of tables: select what, from where, filter, group, order. DuckDB runs it on CSV and Parquet files with no server, which is why the data hour uses it. Window functions (lag, row_number) are the step from junior to medior."

history = "SQL was designed at IBM in 1974 (as SEQUEL, by Chamberlin and Boyce) and standardised by ANSI in 1986 and ISO in 1987. It has outlived every technology that promised to replace it. DuckDB (started at CWI Amsterdam in 2018, first release 2019) brought analytics SQL to a single file."
try_it = "duckdb < workspace/sql/streaks.sql, then change limit 3 to limit 10 and read the lag() comment."

unlocks = ["data", "apis"]

