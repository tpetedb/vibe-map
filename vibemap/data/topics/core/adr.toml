# Architecture decision records. Regenerate the tree after editing: just tree
id = "adr"
title = "Architecture decision records"
age = "imperial"
shelf = "docs"
depth = 3

summary = "An ADR is one short file per decision: Title, Status, Context (the forces), Decision (we will ...), Consequences (all of them). Numbered, never deleted, superseded instead. It is the memory an agent cannot infer from the code: why the repo is MIT, why the game is one file, why XP is verified. AGENTS.md says what the rules are; docs/adr/ says why."

history = "Michael Nygard published Documenting Architecture Decisions on 15 November 2011: a page per decision, kept in the repo with the code, in a form borrowed from Alexandrian patterns. The GitHub adr organisation (adr.github.io) collects the templates and tools that followed; MADR, the Markdown variant with drivers and options, reached 4.0.0 in September 2024."
try_it = "ls docs/adr, then cat docs/adr/0004-quests-verify-real-work.md. Write ADR 0005 with the adr skill for the next thing you decide."

unlocks = []

