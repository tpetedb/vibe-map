# HTML, CSS and JavaScript. Regenerate the tree after editing: just tree
id = "web"
title = "HTML, CSS and JavaScript"
age = "feudal"
shelf = "code"
depth = 2

summary = "The three languages of a web page: structure, style, behaviour. A single HTML file can hold all three, which is why the game is one file. JavaScript is also the language of Node and most CLIs you install with npm."

history = "Tim Berners-Lee's first web software ran in 1990 and HTML was written up as an IETF draft in 1993; CSS1 became a W3C Recommendation in 1996; Brendan Eich prototyped JavaScript in ten days in May 1995. Node.js (2009) put JavaScript on servers; npm calls itself the world's largest software registry."
try_it = "Open workspace/game/index.html in a text editor and in a browser side by side. Change the h1, reload."

unlocks = ["http", "localhost"]

