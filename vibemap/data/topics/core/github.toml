# GitHub, pull requests, Pages. Regenerate the tree after editing: just tree
id = "github"
title = "GitHub, pull requests, Pages"
age = "castle"
shelf = "git"
depth = 2

summary = "GitHub hosts git repositories and adds the social layer: issues, pull requests (proposed changes with review), Actions (CI), Pages (free static hosting). A PR is how professionals let others check work before it lands; it is also how you check an agent's work."

history = "GitHub launched in 2008 (pull requests arrived in February 2008), was acquired by Microsoft in 2018, and passed 100 million developers in January 2023. Pull requests turned code review into a habit; Copilot (technical preview June 2021) put a model in the editor; Copilot's coding agent and OpenAI's Codex (2025) now open PRs themselves."
try_it = "gh repo create, gh pr create after a branch, then enable Pages. The 22:30 workstream."

unlocks = ["ci", "cloud"]

