# TOML in practice: pyproject.toml. Regenerate the tree after editing: just tree
id = "toml"
title = "TOML in practice: pyproject.toml"
age = "feudal"
shelf = "formats"
depth = 2

summary = '''TOML is INI with types. [tables] group keys; key = "value" pairs are typed (strings, numbers, booleans, dates, arrays); `[[arrays.of.tables]]` repeat asection, one block per item. Python packaging chose it because it is unambiguous, has a small spec, and stays readable when hand-edited: pyproject.toml declares the package, its dependencies and the tool settings (ruff, pytest) in one file.'''

history = "TOML was started by Tom Preston-Werner in 2013 and reached 1.0.0 in January 2021. PEP 518 (2016) introduced pyproject.toml for build requirements, PEP 621 (2020) added the [project] table, and tomllib joined the standard library with Python 3.11 in October 2022."
try_it = "Read pyproject.toml in this repo and add a dependency, then uv sync."

unlocks = ["pylibs"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. TOML is a
# format with a repository and no address; the echo is the specification that
# put it in Python packaging.

[[origins]]
place = "the-internet"
year = 2021
what = "TOML v1.0.0, a minimal configuration file format by Tom Preston-Werner, Pradyun Gedam and others, is published."
source = "https://toml.io/en/v1.0.0"
primary = true

[[origins]]
place = "a-standards-body"
year = 2016
what = "Brett Cannon, Nathaniel J. Smith and Donald Stufft write PEP 518, which stores a project's build system dependencies in a file named pyproject.toml."
source = "https://peps.python.org/pep-0518/"

