# localhost and ports. Regenerate the tree after editing: just tree
id = "localhost"
title = "localhost and ports"
age = "dark"
shelf = "shell"
depth = 2

summary = "localhost (127.0.0.1) is your own machine talking to itself over the network stack. A port is a numbered door; a dev server on port 8000 means open http://localhost:8000. Everything web starts here before it goes anywhere."

history = "Network 127 is set aside for loopback in the Assigned Numbers RFCs (RFC 990, 1986); TCP/IP became the ARPANET standard on 1 January 1983 (RFC 801). Port numbers were assigned by hand by Jon Postel for years, in those same RFCs."
try_it = "python3 -m http.server 8000 in the game folder, open http://localhost:8000/game/ in a browser. Ctrl-C to stop."

unlocks = ["http", "docker", "mcp"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened.

[[origins]]
place = "usc-isi"
year = 1986
what = "RFC 990, by Reynolds and Postel at ISI, assigns the class A network number 127 the loopback function."
source = "https://www.rfc-editor.org/rfc/rfc990.html"
primary = true

