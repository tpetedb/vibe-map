# CI/CD and automation. Regenerate the tree after editing: just tree
id = "ci"
title = "CI/CD and automation"
age = "castle"
shelf = "git"
depth = 3

summary = "Continuous integration: every push runs the tests and checks in a clean machine. Continuous delivery: passing pushes deploy. GitHub Actions is a YAML file in .github/workflows/. This is where headless agents also live: a PR review bot is claude -p in a workflow."

history = "CruiseControl (ThoughtWorks) was registered in March 2001, Hudson was renamed Jenkins in January 2011, Travis CI started in 2011, GitHub Actions became generally available in November 2019. CI made 'it works' a machine's opinion instead of a person's."
try_it = "Ask Claude: 'add a GitHub Actions workflow that runs python3 workspace/python/scores.py and the three DuckDB queries on every push'. Push. Watch the tab."

unlocks = ["headless", "tests"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. The service
# this camp runs its checks on is the primary; Jenkins is an echo, and its
# renaming was a vote of a project with no address, told to its mailing lists.

[[origins]]
place = "github-sf"
year = 2019
what = "GitHub announces that Actions now supports CI/CD, with workflows written in a syntax based on YAML and kept as code in a repository."
source = "https://github.blog/news-insights/product-news/github-actions-now-supports-ci-cd/"
primary = true

[[origins]]
place = "the-internet"
year = 2011
what = "The vote on renaming Hudson closes with 214 votes to rename and 14 for the status quo, and Andrew Bayer tells the project's mailing lists that Jenkins lives."
source = "https://www.jenkins.io/blog/2011/01/29/jenkins/"

