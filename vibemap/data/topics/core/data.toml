# Data: files, schemas, warehouses. Regenerate the tree after editing: just tree
id = "data"
title = "Data: files, schemas, warehouses"
age = "feudal"
shelf = "data"
depth = 1

summary = "Data lives in files (CSV, Parquet), databases (Postgres, SQLite), and warehouses (Snowflake, BigQuery, DuckDB locally). A schema is the contract: column names and types. Most data pain is schema drift, which is why AGENTS.md pins the columns of scores.csv."

history = "Relational databases: Codd 1970. Postgres 1986 (Berkeley). SQLite 2000, in every phone. Cloud warehouses (BigQuery 2011, Redshift 2012, Snowflake 2015) separated storage from compute. Parquet (2013, Twitter and Cloudera) is the file format they all read."
try_it = '''duckdb -c "copy 'workspace/data/scores.csv' to 'workspace/data/scores.parquet'" then query the parquet file. Same SQL, smaller file.'''

unlocks = ["apis", "tests"]

