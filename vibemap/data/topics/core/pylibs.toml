# Python libraries: what they are for. Regenerate the tree after editing: just tree
id = "pylibs"
title = "Python libraries: what they are for"
age = "feudal"
shelf = "code"
depth = 2

summary = "pandas (tables), numpy (numbers), matplotlib/plotly (charts), requests/httpx (talk to APIs), duckdb (SQL on files), pydantic (validate data), fastapi (build an API), typer/click (build a CLI), playwright (drive a browser), pytest (tests). Install with uv; import only what removes real work."

history = "NumPy 2005 (1.0 in 2006), pandas 2008 (Wes McKinney, at a hedge fund), requests 2011, pytest 2004 lineage, FastAPI 2018, pydantic 2017, Playwright 2020, DuckDB 2019 (started at CWI in 2018). The stack is young; most of it postdates the iPhone."
try_it = '''uv pip install pandas, then python3 -c "import pandas as pd; print(pd.read_csv('workspace/data/scores.csv').describe())".'''

unlocks = ["apis", "tests"]

