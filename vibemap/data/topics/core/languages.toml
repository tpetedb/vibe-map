# Other languages and what they are for. Regenerate the tree after editing: just tree
id = "languages"
title = "Other languages and what they are for"
age = "feudal"
shelf = "code"
depth = 3

summary = "TypeScript: JavaScript with types, most web apps. Go: servers and CLIs, one binary. Rust: speed and safety, the new systems language. Java/Kotlin, C#: enterprise and Android. Swift: Apple. C/C++: everything underneath. Bash: gluing them. You do not learn them all; you learn to read them, and agents write them."

history = "C 1972, C++ 1985, Java 1995, C# 2002, Go 2009, Rust 2015 (1.0), Swift 2014, TypeScript 2012. Each language is a bet on what is expensive: programmer time (Python), machine time (Rust), or organisational scale (Java)."
try_it = "Ask Claude: 'rewrite workspace/python/scores.py in Go, explain each line to a Python person'. Read it. Delete it."

unlocks = ["docker"]

