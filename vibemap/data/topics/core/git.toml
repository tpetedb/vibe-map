# Git. Regenerate the tree after editing: just tree
id = "git"
title = "Git"
age = "dark"
shelf = "git"
depth = 1

summary = "A time machine for a folder. Commit = named snapshot, branch = parallel line of work, merge = bring them together, revert = undo safely. Agents can produce a lot of change fast; git is what makes that safe."

history = "Linus Torvalds wrote git in April 2005, in about ten days, after the Linux kernel lost its previous tool (BitKeeper). GitHub launched in 2008 and made it social; today git is the default version control system almost everywhere."
try_it = "git log --oneline | head, then change one line, git diff, git commit -am 'why', git revert HEAD."

unlocks = ["github", "hooks", "ci", "semver"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. No page we
# found puts the writing of git at an address, so it sits on the network the
# kernel community worked over.

[[origins]]
place = "the-internet"
year = 2005
what = "The Linux development community, and in particular Linus Torvalds, develop their own tool, Git, after BitKeeper's free-of-charge status is revoked."
source = "https://git-scm.com/book/en/v2/Getting-Started-A-Short-History-of-Git"
primary = true

