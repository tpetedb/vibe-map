# Docker and containers. Regenerate the tree after editing: just tree
id = "docker"
title = "Docker and containers"
age = "castle"
shelf = "ship"
depth = 2

summary = "A container is a packaged process: your code, its dependencies, and a slice of an operating system, running the same on any machine. A Dockerfile is the recipe; an image is the result; a container is a running copy. It ends 'works on my machine'."

history = "Chroot arrived with Seventh Edition Unix in 1979; Linux mount namespaces in 2002 (kernel 2.4.19) and cgroups in January 2008 (2.6.24). Docker (Solomon Hykes, dotCloud) was first shown at PyCon in March 2013 and made them usable; Kubernetes (Google, open sourced 2014) made them run in fleets. Much of cloud software today runs in containers."
try_it = "Install Docker Desktop or OrbStack. docker run -it python:3.12 python -c 'print(1)'. You just ran Python in a box you did not install."

unlocks = ["cloud", "ci", "kubernetes"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened.
# Docker was first shown at PyCon 2013, and the place file's own source puts
# that PyCon in Santa Clara. The 0.1.0 tag a week later is in the sources.

[[origins]]
place = "santa-clara"
year = 2013
what = "On 15 March 2013 Solomon Hykes, the founder of Docker, first demos Docker publicly at PyCon."
source = "https://www.docker.com/blog/docker-nine-years-young/"
primary = true

[[origins]]
place = "linux-foundation"
year = 2015
what = "Docker donates its container format and runtime, runC, to the Open Container Initiative, launched under the Linux Foundation on 22 June 2015."
source = "https://opencontainers.org/about/overview/"

