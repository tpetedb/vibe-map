# LLM versus harness. Regenerate the tree after editing: just tree
id = "llm"
title = "LLM versus harness"
age = "imperial"
shelf = "agents"
depth = 1

summary = "The LLM is the model: text in, text out, no memory, no hands. The harness is everything around it: the loop that calls it repeatedly, the tools it can run (bash, edit file), the files it reads first (AGENTS.md), permissions, hooks, memory. Claude Code, Codex CLI, Cursor are harnesses. Most of the difference in results comes from the harness and what you put in it, not from the model."

history = "Transformer 2017 (Google, 'Attention is all you need'). GPT-3 2020. ChatGPT November 2022. Claude March 2023. MCP November 2024. Agentic coding harnesses: Cursor's agent mode November 2024, Claude Code February 2025, Codex CLI April 2025. AGENTS.md August 2025."
try_it = "Run claude in the template folder and ask 'what files did you read before answering?'. That list is the harness."

unlocks = ["context", "harness"]

