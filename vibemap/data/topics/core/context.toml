# Context window and prompts. Regenerate the tree after editing: just tree
id = "context"
title = "Context window and prompts"
age = "imperial"
shelf = "agents"
depth = 1

summary = "The context window is the model's working memory for one conversation: everything it can see right now, in tokens. Files, instructions, tool output all compete for it. Specificity, scope and 'what not to touch' win because the model cannot read your mind and cannot remember last week without a file."

history = "GPT-3 had a 2,048-token window (2020); Claude went to 100k in May 2023; Gemini 1.5 ran a million tokens in February 2024 and Claude Sonnet 4 in August 2025. Bigger windows did not remove the need for good instructions; they moved it to what you load."
try_it = "Give the same task twice: 'make it cooler' and 'add a purple badge, keep stats, touch nothing else'. Compare the diff."

unlocks = ["agentsmd", "skills"]

