# README and the quickstart. Regenerate the tree after editing: just tree
id = "readme"
title = "README and the quickstart"
age = "feudal"
shelf = "docs"
depth = 1

summary = "The README is the front page: what this is, for whom, and the commands that get a stranger from clone to a working run, on the first screen. GitHub shows it under the file list, agents read it first, and it is the last thing maintainers update, which is why every command in it must be one you just ran."

history = "The name is older than most of this tree. Seventh Edition Unix (1979) shipped /usr/doc/README, a few lines telling you how to format the manual's papers, and DECUS library tapes for the PDP-10 carried READ.ME files of 'random notes' for whoever installed the software. Markdown and GitHub turned README.md into the page a repository opens on; makeareadme.com is the modern checklist."
try_it = "head -30 README.md, then run the first Quickstart command exactly as written. If it fails, fix the README, not the reader."

unlocks = ["github"]

[[sources]]
label = "Make a README"
url = "https://www.makeareadme.com"

[[sources]]
label = "GitHub docs, About READMEs"
url = "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes"

