# Interfaces: GUI, TUI, CLI, API. Regenerate the tree after editing: just tree
id = "interfaces"
title = "Interfaces: GUI, TUI, CLI, API"
age = "dark"
shelf = "shell"
depth = 1

summary = "Four ways to talk to a program. A CLI takes a command and flags and prints text (`vibe status`, git, uv). A TUI draws a screen inside the terminal you can move around in (`just start`, htop, the Claude Code chat). A GUI is windows and a pointer (Obsidian, Zed, the browser game). An API is for programs, not people: HTTP endpoints that return JSON (GitHub's REST API), or a protocol two programs agree on, such as MCP between an agent and a tool server and ACP between an editor and an agent. One program can have all four: Obsidian has a GUI, a URI scheme and a CLI."

history = "The command line came with time-sharing systems and Unix (1969); full-screen terminal programs followed once terminals could address the screen, with vi (1976) and the curses library (1978); the graphical desktop was prototyped on the Xerox Alto (1973) and sold with the Macintosh (1984); REST named the web's API style in Roy Fielding's dissertation (2000); MCP was published by Anthropic on 25 November 2024 and ACP by Zed in August 2025."
try_it = "Run the same thing four ways: `uv run vibe status` (CLI), `just start` then Campaign map (TUI), the Roadmap button in game/vibe-map.html (GUI), and `gh api repos/tpetedb/vibe-map` (API). Notice what each one is good at."

unlocks = ["unix", "mcp", "apis"]

