# Dotfiles. Regenerate the tree after editing: just tree
id = "dotfiles"
title = "Dotfiles"
age = "dark"
shelf = "shell"
depth = 2

summary = "Hidden files and folders (.zshrc, .gitconfig, .claude/, .agents/) that configure your tools. Your agent setup is dotfiles: AGENTS.md is the exception that chose to be visible. Keep them in a repo and your setup becomes portable."

history = "Sharing dotfile repos on GitHub took off after GitHub launched in 2008; the community guide dotfiles.github.io followed in 2012. Today the same idea configures AI agents: .claude/settings.json, .agents/skills/."
try_it = "ls -la ~ and open ~/.zshrc. Add one alias: alias g='uv run vibe'."

unlocks = ["config", "env", "harness"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened.

[[origins]]
place = "github-sf"
year = 2008
what = "Chris Wanstrath posts that GitHub is officially live."
source = "https://github.blog/2008-04-10-we-launched/"
primary = true

[[sources]]
label = "dotfiles.github.io"
url = "https://dotfiles.github.io"

[[sources]]
label = "Claude Code settings"
url = "https://code.claude.com/docs/en/settings"

[[sources]]
