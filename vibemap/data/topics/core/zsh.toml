# zsh and your shell config. Regenerate the tree after editing: just tree
id = "zsh"
title = "zsh and your shell config"
age = "dark"
shelf = "shell"
depth = 2

summary = "~/.zshrc runs every time you open a terminal: it sets PATH (the folders where commands are looked up), aliases (short names for long commands), the prompt, and small functions. zsh is the macOS default; it is bash-compatible for daily use and adds better completion and globbing. oh-my-zsh bundles plugins and themes; starship is a fast prompt that works in any shell. Keep .zshrc in your dotfiles repo so a new machine is one clone away."

history = "zsh was written by Paul Falstad while a student at Princeton, around 1990. Apple made it the default login shell with macOS 10.15 Catalina in October 2019, replacing bash."
try_it = "source scripts/vibe.zsh then g status."

unlocks = ["dotfiles"]

