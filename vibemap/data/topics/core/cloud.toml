# Cloud and servers. Regenerate the tree after editing: just tree
id = "cloud"
title = "Cloud and servers"
age = "castle"
shelf = "ship"
depth = 2

summary = "A server is a computer that is always on. The cloud rents you one by the hour (AWS 2006, Azure 2010, GCP 2008) or runs your code without one (serverless: Lambda 2014, Vercel, Cloudflare Workers). For most people's first project, a static host (GitHub Pages) or a small VPS (Hetzner, Fly.io) is enough."

history = "AWS launched S3 in March and EC2 in August 2006; renting compute by the hour changed who could start a company. Google App Engine followed in April 2008 and Windows Azure went live in February 2010. Serverless (AWS Lambda, November 2014) removed the server from view; today agents can provision all of it with one prompt, which is why understanding the bill matters."
try_it = "Deploy the game to GitHub Pages (free). Later: fly launch on the FastAPI endpoint."

unlocks = ["kubernetes", "cost"]

