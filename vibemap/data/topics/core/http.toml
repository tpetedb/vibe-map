# HTTP and APIs. Regenerate the tree after editing: just tree
id = "http"
title = "HTTP and APIs"
age = "castle"
shelf = "net"
depth = 1

summary = "HTTP is request and response: a URL, a method (GET, POST), headers, a body, a status code (200, 404, 500). An API is an HTTP endpoint that returns data instead of a page, usually JSON. Every AI model you call is an HTTP API; MCP is a layer on top of the same idea."

history = "HTTP 0.9 in 1991, HTTP/1.1 in 1997 (RFC 2068), HTTP/2 in 2015 (RFC 7540). REST was named in Roy Fielding's 2000 dissertation. The OpenAI API (June 2020) made calling a model one POST request."
try_it = "curl -s https://api.github.com/repos/duckdb/duckdb | head -20. You just used an API."

unlocks = ["apis", "mcp", "ssh"]

[[origins]]
place = "cern"
year = 1990
what = "In October 1990 Tim Berners-Lee, working at CERN, starts on the first World Wide Web server, httpd; the initial specification of HTTP is his."
source = "https://www.w3.org/People/Berners-Lee/Longer.html"
primary = true

[[origins]]
place = "uc-irvine"
year = 1997
what = "In January 1997 RFC 2068 defines HTTP/1.1; its first author is R. Fielding of UC Irvine."
source = "https://www.rfc-editor.org/rfc/rfc2068"

[[origins]]
place = "ietf"
year = 2015
what = "In May 2015 the Internet Engineering Task Force publishes RFC 7540, Hypertext Transfer Protocol Version 2 (HTTP/2)."
source = "https://www.rfc-editor.org/rfc/rfc7540"

