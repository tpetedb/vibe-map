# Git hooks. Regenerate the tree after editing: just tree
id = "githooks"
title = "Git hooks"
age = "dark"
shelf = "git"
depth = 2

summary = "Scripts git runs at moments in its own lifecycle: pre-commit before a commit is written, commit-msg to check the message, pre-push before anything leaves the machine, post-checkout and post-merge after a switch. A non-zero exit aborts the step. They live in .git/hooks (not versioned), or in a folder you commit and point at with core.hooksPath; the pre-commit framework and lefthook manage them from a config file."

history = "Hooks have been in git since the first releases (the githooks manual page lists thirty of them); core.hooksPath arrived in Git 2.9 (June 2016) so a team can version its hooks; pre-commit (Yelp, 2014) and lefthook (Evil Martians, 2019) turned them into a one-line install."
try_it = '''
In this repo: `mkdir -p .githooks && printf '#!/bin/sh
uv run ruff check vibemap tests tools
' > .githooks/pre-commit && chmod +x .githooks/pre-commit && git config core.hooksPath .githooks`. Then commit something with a lint error and watch it refuse.'''

unlocks = ["agenthooks", "ci"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. The githooks
# manual page carries no date, so the origin is the dated release that let a
# team commit its hooks, and git itself has no address.

[[origins]]
place = "the-internet"
year = 2016
what = "Git 2.9 adds core.hooksPath, so one folder of hooks can be pointed at from every repository."
source = "https://github.blog/open-source/git/git-2-9-has-been-released/"
primary = true

