# Kubernetes and platforms. Regenerate the tree after editing: just tree
id = "kubernetes"
title = "Kubernetes and platforms"
age = "future"
shelf = "ship"
depth = 3

summary = "Kubernetes runs containers across many machines: scheduling, scaling, self-healing. Most knowledge workers never need to touch it; they need to know it is why 'the cloud' can scale, and that agents can now write its YAML for them."

history = "Google's internal Borg (running containers for over a decade by 2016) became Kubernetes (open sourced 2014). In the 2020s it became the default substrate of cloud software; platform engineering teams now hide it behind internal tools."
try_it = "Read one Deployment YAML and identify: image, replicas, port."

unlocks = ["future"]

