# Config formats: JSON, YAML, TOML, Markdown. Regenerate the tree after editing: just tree
id = "config"
title = "Config formats: JSON, YAML, TOML, Markdown"
age = "dark"
shelf = "formats"
depth = 1

summary = "Tools read settings from text files in a few formats. JSON: strict, braces, what APIs speak. YAML: indentation, what CI and Docker Compose use. TOML: sections, what Python packaging uses. Markdown: prose with light structure, what agents and Obsidian read."

history = "JSON was first presented at json.org by Douglas Crockford in 2001; YAML began in 2001 (1.0 spec in 2004); Markdown by John Gruber in 2004; TOML by Tom Preston-Werner in 2013. Agents made Markdown the config format for instructions (AGENTS.md, SKILL.md) because it is readable by both people and models."
try_it = "Open .claude/settings.json (JSON) and .agents/skills/duckdb-sql/SKILL.md (Markdown with YAML frontmatter). Spot the three formats in one repo."

unlocks = ["env", "yaml", "toml", "agentsmd", "skills"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. Of the four
# formats only JSON became a standard with a body behind it and a dated
# edition, so that is where this topic stands; the other three have their own
# topics.

[[origins]]
place = "ecma-international"
year = 2013
what = "Ecma International publishes the first edition of ECMA-404, the JSON data interchange syntax, in October 2013."
source = "https://ecma-international.org/publications-and-standards/standards/ecma-404/"
primary = true

