# Building the builder. Regenerate the tree after editing: just tree
id = "meta"
title = "Building the builder"
age = "castle"
shelf = "agents"
depth = 2

summary = "Some of the most valuable work is not the feature: it is the template, the tool, the agent configuration or the maintainer note that makes the next feature, by you, a colleague or an agent, cheaper and safer to build. This is the meta step, and it is easy to skip because it produces nothing a user sees. Engelbart called it bootstrapping: use each gain in your tools to build the next tool. Grove called it leverage: judge a piece of work by how much future output it multiplies. In this repository the template that vibe new copies, the skills, the hooks, AGENTS.md and docs/MAINTAINERS.md are all of that kind; they exist so that building the course, and building your own things inside a camp, costs less next time. Brooks's warning applies: no tool removes the essential difficulty of deciding what to build; the meta work removes the accidental difficulty around it."

history = "Engelbart's 1962 framework (Augmenting Human Intellect) set out bootstrapping: pursue the quickest gains first and spend the resulting capability on the next gain. Brooks's No Silver Bullet (1986) separated essential from accidental difficulty and argued for growing systems and reusing components over hoping for one tool. Grove's High Output Management (1983) gave the word leverage. AGENTS.md (2025) and Claude Code's memory files are the current form: instructions written once, read at the start of every future session, so the cost is paid once and the benefit compounds."
try_it = "Add one line to an agent-config file in your camp (AGENTS.md or a skill) that captures something you had to explain to the agent twice this session. Next session, note what was cheaper. Then read docs/MAINTAINERS.md in the product repository and find the three places where a change in one zone reaches another; that table is the meta layer of this whole course."

unlocks = ["concerns", "skills", "agentsmd", "semver"]

