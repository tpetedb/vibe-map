# Markdown and Obsidian. Regenerate the tree after editing: just tree
id = "markdown"
title = "Markdown and Obsidian"
age = "feudal"
shelf = "formats"
depth = 1

summary = "Markdown is prose with a little structure (#, -, **, `[[links]]`). It is the file format of documentation, READMEs, AGENTS.md, skills, and Obsidian notes. Obsidian is a Markdown editor with a graph, so your notes are plain files an agent can read and write."

history = "Markdown 2004; GitHub's own flavour was public by 2009 and made it the format of READMEs; Obsidian (2020) made it a second brain; agent instruction files in 2024 to 2025 made it a config language."
try_it = "Write vault/Camp/Me.md with three sentences and two `[[links]]`. Open the graph."

unlocks = ["vault", "agentsmd", "readme", "adr", "obsidian"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. Markdown was
# released on a personal site with no address on it; the echo is the editor
# this camp keeps its notes in.

[[origins]]
place = "the-internet"
year = 2004
what = "John Gruber releases Markdown 1.0.1, a plain text formatting syntax and a Perl tool that converts it to HTML."
source = "https://daringfireball.net/projects/markdown/"
primary = true

[[origins]]
place = "obsidian"
year = 2020
what = "Erica Xu starts Obsidian to build a note-taking app for her notes; it stores data on your device in simple, open file formats."
source = "https://obsidian.md/about"

