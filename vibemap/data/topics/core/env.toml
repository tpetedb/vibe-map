# .env files and secrets. Regenerate the tree after editing: just tree
id = "env"
title = ".env files and secrets"
age = "dark"
shelf = "formats"
depth = 1

summary = "A .env file holds KEY=VALUE pairs (API tokens, database URLs) that your code reads at startup, so the secret lives on the machine and not in the repo. The pattern: .env is listed in .gitignore and never committed; .env.example (in this repo env.example, without the dot, because some agent guardrails refuse anything that looks like a real .env) is committed with the same keys and empty values so the next person knows what to fill in; python-dotenv loads .env into os.environ. A token that lands in a commit has to be rotated, because git history is forever."

history = "The twelve-factor app (Adam Wiggins at Heroku, 2011) made 'store config in the environment' a rule. The dotenv convention started with Brandon Keepers' Ruby dotenv gem in July 2012; python-dotenv followed on PyPI in September 2014."
try_it = '''Copy env.example to .env in this repo and print one variable: uv run python -c "from dotenv import dotenv_values; print(dotenv_values('.env'))".'''

unlocks = ["security", "docker"]

# Where this happened. The place is a file in vibemap/data/places/;
# exactly one origin is primary, and every source was opened. The Twelve-
# Factor App gave the rule but its pages carry no year of their own, so the
# origin is the release that named the file, on the registry it shipped from.

[[origins]]
place = "the-internet"
year = 2012
what = "Brandon Keepers releases dotenv 0.1.0, which loads environment variables from a .env file."
source = "https://rubygems.org/gems/dotenv/versions/0.1.0"
primary = true

