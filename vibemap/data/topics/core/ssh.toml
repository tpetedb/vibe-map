# SSH and remote machines. Regenerate the tree after editing: just tree
id = "ssh"
title = "SSH and remote machines"
age = "castle"
shelf = "shell"
depth = 3

summary = "SSH is an encrypted terminal to another computer. ssh user@host gives you a shell on a server; the same key pair authenticates you to GitHub. Once you can SSH somewhere, everything in the Dark Age works there too, including running an agent on a remote box."

history = "SSH was written by Tatu Ylonen at Helsinki University of Technology and published in July 1995, after a password sniffer was found on the university network; OpenSSH (first shipped with OpenBSD in December 1999) is what every Mac and Linux ships."
try_it = "ssh-keygen -t ed25519, then gh ssh-key add ~/.ssh/id_ed25519.pub, then ssh -T git@github.com."

unlocks = ["cloud", "docker"]

