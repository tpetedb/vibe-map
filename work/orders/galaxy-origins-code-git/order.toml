builder = "builder-galaxy-origins-code-git"

owns = [
  "vibemap/data/topics/core/ci.toml",
  "vibemap/data/topics/core/git.toml",
  "vibemap/data/topics/core/githooks.toml",
  "vibemap/data/topics/core/github.toml",
  "vibemap/data/topics/core/concerns.toml",
  "vibemap/data/topics/core/languages.toml",
  "vibemap/data/topics/core/pylibs.toml",
  "vibemap/data/topics/core/python.toml",
  "vibemap/data/topics/core/tests.toml",
  "vibemap/data/topics/core/web.toml",
  "vibemap/data/topics/core/config.toml",
  "vibemap/data/topics/core/env.toml",
  "vibemap/data/topics/core/markdown.toml",
