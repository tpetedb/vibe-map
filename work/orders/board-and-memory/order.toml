v = 1
id = "board-and-memory"
title = "The board room and the shared memory: one reader at session start for both teams"
team = "harness"
branch = "claude/board-and-memory"
goal = "ways-of-working"
issue = 96
builder = "builder-board-and-memory"

owns = [
  "tools/board.py",
  "work/BOARD.md",
  "work/teams.toml",
  "scripts/memory-mcp.sh",
  ".mcp.json",
  ".codex/config.toml",
  ".codex/hooks.json",
  ".claude/settings.json",
  "tools/sync_template.py",
  "justfile",
  ".agents/skills/shared-memory/SKILL.md",
  "docs/adr/0018-shared-memory.md",
  "docs/adr/README.md",
  "tests/test_board.py",
  "tests/test_memory.py",
  "changelog.d/board-and-memory.added.md",
]
# docs: the ADR and its index. The Codex files are harness files (teams.toml adds
# `.codex/` to harness in this order); the Codex reviewer verifies them on the
# installed client, which is the review, not a sign-off.
cross = ["docs"]
needs = ["harness-work-ci-followups"]

# What it builds, in one paragraph: tools/board.py (stdlib) with `read` (last 30
# ROOM.md entries, derived columns: declared owns of checked-out orders labelled
# "checked out", landed = accepted review on main, explicit SLOT reservations with
# observed jobs as a cross-check, then the memory digest: every rule: and gotcha:,
# the 10 newest decision:, under 6,000 characters), `say`, `slot take|free`,
# `memory-lint` (caps 300 entities and 8 observations, line format, secret regex,
# dangling relations) and `mirror` (DECISION and verified LANDED to #95,
# deduplicated by entry id, run by a manager, never by a hook). ROOM.md and
# memory.jsonl live in the git common dir and are never tracked. The memory
# server is @modelcontextprotocol/server-memory@2026.8.31 through
# scripts/memory-mcp.sh; read_graph is denied in both configs. Camps do not get
# any of this: tools/sync_template.py strips the SessionStart hook, the deny and
# the MCP entry, and the template test proves it.

[[criteria]]
id = "c1"
text = "The order's own tests pass: locked append with stable entry ids and no interleaving from two writers; the three derived columns; a digest under 6,000 characters on a 300-entity fixture; memory-lint refuses an over-cap graph, a malformed observation and a secret-looking line; the hook command prints the digest and exits 0 when the memory file is missing; two memory writers in two processes at once lose nothing (writes are serialized, per the board amendment of 21:43Z)."
check = "uv run pytest -q tests/test_board.py tests/test_memory.py"

[[criteria]]
id = "c2"
text = "The reader runs from this checkout and from a linked worktree and resolves the same room; the lint passes on the live file."
# Builder's repair: the first form cd'd in a subshell, so $OLDPWD was empty under
# sh and uv refused `--project ""` before the reader ran. Same intent: read here,
# read again from another checkout of this repository, diff, lint. The reader
# resolving one room from two checkouts is also a test in tests/test_board.py.
check = '''uv run python tools/board.py read > /tmp/board-read-a.txt && here="$PWD" && other="$(git worktree list --porcelain | sed -n 's/^worktree //p' | grep -vxF "$here" | head -n 1)" && (cd "${other:-$here}" && uv run --project "$here" python "$here/tools/board.py" read) > /tmp/board-read-b.txt && diff -q /tmp/board-read-a.txt /tmp/board-read-b.txt && uv run python tools/board.py memory-lint'''

[[criteria]]
id = "c3"
text = "Lint, style, the sink guard, the non-browser battery and every generated check pass; the camp template carries no hook, deny or MCP entry from this order."
check = "uv run ruff check -q . && uv run ruff format --check -q . && uv run python tools/checks.py style && uv run python tools/checks.py sinks && uv run pytest -q -m 'not browser and not integration' && for c in build regen_tree gen_cookbook sync_template sync_fork_source gen_syllabus; do uv run python tools/$c.py --check || exit 1; done && ! grep -q memory vibemap/data/template/_claude/settings.json"

[[criteria]]
id = "c4"
text = "On the installed clients: `claude mcp get memory` reports connected and `codex mcp list` shows memory enabled with read_graph disabled; a probe entity created from a Claude session is found by search_nodes from a Codex session in another worktree; the first turn of a fresh Claude session and a fresh Codex session both show the digest header; Codex hook trust was granted through the client's own prompt, nothing bypassed. The Codex reviewer proves this, since Codex owns that runtime."
judge = "reviewer"

[[criteria]]
id = "c5"
text = "work/BOARD.md and the skill say what the board decides and what it never overrides (work-check, work-accept, CI, Tom), the naming and observation conventions, the never-store list, and that ROOM.md stays the short-term channel. The ADR records the choice, the runner-up (Basic Memory) and the switch condition (about 300 entities or search that substring matching cannot serve)."
judge = "reviewer"
