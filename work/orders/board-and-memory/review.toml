[[findings]]
severity = "medium"
file = "tools/board.py"
text = "codex_hooks_on is not true exactly when the main checkout's SessionStart hook is present and trusted. It never reads <root>/.codex/hooks.json and never compares the hash, so it says on in three cases where Codex does not run the hook. just codex then feeds no digest, and the session starts without the board, which breaks the docstring's own rule that unknown counts as off. I tested this in /tmp/rev-bm-r1: a scratch repo with a nested linked worktree, the branch's .codex files in the main checkout, and a temporary CODEX_HOME. I compared board.codex_hooks_on(top, cfg, codex_hooks_root(top)) with codex-cli 0.156.1's own app-server hooks/list for the worktree. They agree on 6 cases: no approval, approved, only the worktree trusted, worktree untrusted with main trusted, main untrusted with the worktree trusted, nothing trusted. They disagree on 3: (C) trusted_hash stale after the hook changes: Codex says modified, board says on; (D) the main checkout's hooks.json has no SessionStart but an old approval remains: Codex lists nothing, board says on; (I) approved but enabled = false in /hooks: Codex reports enabled false, board says on. D is the main checkout's own situation whenever it sits on a commit without the hook, and C follows every edit to the SessionStart hook until someone approves it again. Fix: require a SessionStart entry in <root>/.codex/hooks.json, treat enabled = false as off, and either match Codex's hash (hooks/src/engine/discovery.rs, event plus matcher plus handler) or say in the docstring and BOARD.md that an edited hook reads as on until it is approved again. Add a test for each case."

[[findings]]
severity = "medium"
file = "work/orders/board-and-memory/order.toml"
text = "c6 still says the linked worktree is enrolled with just codex-trust (F055) and asks for one un-enrolled worktree whose hook trust is missing. The recipe was removed in 8361b66, and a worktree inherits the main checkout's trust and hooks, so the Codex reviewer cannot set up that scenario as written. The manager should restate c6 (for example: hooks/list or /hooks in a worktree lists the main checkout's SessionStart, pending review until it is approved once; just codex feeds the digest until then) before Codex rules on it. 'codex-trust fully gone' holds for the code, justfile, docs and changelog, but not for this text."

