file = ".codex/hooks.json"
text = "Landing this breaks Tom's main checkout and strips Codex's work-order hooks there. /Users/maxgroupit/vibe-map carries an UNTRACKED .codex/hooks.json (plus .codex/agents/*.toml) holding Codex's copy of the harness hooks: PreToolUse edit guard (tools/work.py hook pre-tool), PostToolUse data backup, SubagentStop and Stop (tools/work.py hook stop). This order tracks a different .codex/hooks.json with only SessionStart. Reproduced in a scratch repo: merging a branch that adds a tracked file over an untracked one aborts with 'The following untracked working tree files would be overwritten by merge: .codex/hooks.json'. Whoever clears it by taking the tracked file silently loses Codex's four work-order hooks in the main checkout. The .codex/config.toml comment 'Everything else in .codex/ is the client's own machine state' is also untrue: .codex/agents holds Codex's role definitions. Fix inside the order's own files: make the tracked .codex/hooks.json the union (SessionStart plus the four hooks Codex already runs, checked against tools/work.py), agree it with Team Codex on the issue, correct the config.toml comment, and say in BOARD.md what the main checkout must do once (move the untracked file aside) before pulling."

