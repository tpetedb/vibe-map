[[findings]]
severity = "low"
file = "tools/board.py"
text = "Nothing bounds the whole session-start text, only the digest. Live today it is 10,684 characters, of which the checked-out list is 20 lines up to 200 characters each and grows with every worktree; the digest comes last, so any truncation cuts the memory first. Codex's additionalContextLimit 5000 is a token threshold (per its hooks docs, default 2500) so it fits today; the ADR's 'a few thousand characters' understates it. Cap the checked-out list (ids and branches only, or the N most recent) or put the digest before it."

[[findings]]
severity = "low"
file = "tools/board.py"
text = "The hook runs a bare python3, and board.py needs 3.11+ (from datetime import UTC). /usr/bin/python3 on this Mac is 3.9.6: the import fails with a traceback and exit 1 before the reader's own try/except, so a session whose PATH lacks Homebrew or a venv gets a hook error instead of the digest. The existing tools/work.py hooks share this precondition, so it is not new, but the docstring 'a hook can run it with a bare python3' should say 3.11 or the import should not need it."

[[findings]]
severity = "low"
file = "work/BOARD.md"
text = "BOARD.md says CLAIM and LANDED 'are derived from facts rather than typed' and the skill says 'never post those by hand', yet mirror posts typed LANDED entries whose order work.py confirms, and the ADR says 'verified LANDED entries are mirrored'. Say who types LANDED (the landing manager) or drop LANDED from the mirror."

[[findings]]
severity = "low"
file = ".claude/settings.json"
text = "The SessionStart matcher is startup|resume|clear|compact; Claude Code's hooks docs list a fifth source, fork. A forked session inherits the earlier context, so the cost is small, but the matcher could simply be omitted to fire on every start."

[[findings]]
severity = "low"
file = "tools/board.py"
text = "serve() holds the memory lock for up to 60 s waiting for a mutation's response and blocks that proxy's whole input loop meanwhile. A server reply that carries no id (a parse error) or a hung npx fetch holds every other session's writes for the full minute. Acceptable for now; worth a shorter timeout or releasing on any error response."
