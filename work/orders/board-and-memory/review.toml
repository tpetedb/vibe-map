[[findings]]
severity = "high"
file = "work/BOARD.md"
text = "c6 security boundary fails on Codex 0.156.1: a linked worktree launched by just codex exec -s workspace-write --json with only common .git/board passed as --add-dir can write a sibling file in common .git. Reproduction: ask that Codex session to run touch /private/tmp/board-review.P8gVjb/main/.git/review-probe; it reports exit 0 and the file exists. .agents/review-probe was denied in the same client. BOARD.md says nothing elsewhere in .git is writable. Fix the boundary or change the acceptance and setup before landing."

[[findings]]
severity = "medium"
file = "tools/board.py"
text = "On this installed client, plain just codex exited before a session with 'Ignoring --add-dir ... effective permissions do not allow additional writable roots'. Explicit -s workspace-write made the launch work. The documented just codex entry point does not by itself provide a writable board with this host's effective defaults."
