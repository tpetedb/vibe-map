verdict = "fail"
evidence = "Installed codex-cli 0.156.1. In a disposable clone of reviewed commit 850dbe0 (main=/private/tmp/board-review.P8gVjb/main, linked=/private/tmp/board-review.P8gVjb/linked), app-server hooks/list from linked listed sessionStart keyed to main/.codex/hooks.json:session_start:0:0, source project, trustStatus untrusted, hash sha256:a066f63aa1c2747dc523b8fec03669e94839cf6c2f648c3d63bbb27853755112. I gave no hook trust or bypass. With -s workspace-write, just codex exec wrote ROOM entries d8aaa1ed from main and 98114f03 from linked; interactive just codex resume --include-non-interactive <the fresh thread id> wrote e28b2ede. The linked client denied touch .agents/review-probe with Operation not permitted. But from the same linked just codex exec -s workspace-write --json launch, touch /private/tmp/board-review.P8gVjb/main/.git/review-probe exited 0 with empty stderr; I confirmed the file exists. The launcher appended --add-dir /private/tmp/board-review.P8gVjb/main/.git/board. This fails the required denial of another .git path. Plain just codex without -s also exited before a session because effective permissions rejected --add-dir; this host needed an explicit workspace-write override. With the hook pending review I did not claim live hook output; the launcher printed the untrusted reason and its prompt construction is covered by tests."

[[criteria]]
