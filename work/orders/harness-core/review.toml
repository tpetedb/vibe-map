[[findings]]
severity = "medium"
file = ".agents/utils/harness.py"
text = "project_trust() reads projects.\"<main checkout>\".trust_level and reports 'verified' for every linked worktree of a trusted main checkout. The board ruled at 2026-09-24T00:40:10Z, on the #95 receipt from codex-cli 0.156.1, that project trust is enrolled per checkout path (just codex-trust) and that the root's trust is not relied on for worktrees. Every builder and Codex session works in a linked worktree, and there the doctor says verified while the client skips the whole .codex/ layer. harness-supervisor will refuse unattended starts on this value, so a false verified would let one start without the project config and hooks. Fix: look up the checkout's own absolute path (the resolved root), keep main_checkout only if a receipt ever proves inheritance, and change the test and .agents/README.md ('its worktrees inherit it') to match."

