[[findings]]
severity = "high"
file = "vibemap/news.py"
text = '''
`liveness()` counts entries with the parser's own two element names (`item`, Atom `entry`), so it can only see a format change that keeps those names. Rename the entry element in a full feed and entries is 0, which is the quiet branch: `<article>` under rss, a namespaced `<n:item>`, `<post>` under an Atom feed, two or three good entries each, all answer `alive, nothing published yet today`. That sentence is then false, and it is the exact case findings.md set as the condition for choosing the simpler option; main's rule caught it. Run through test_every_registered_feed_is_alive with the nightly's own flags and a registry of a full feed, the quiet digest and the renamed feed: `1 passed`, no output. A source can drop out of the News card for good and the night stays green. tests/test_news.py has no such case: RENAMED keeps `<item>` and renames the children. What would satisfy me: the renamed-entry family reported dead by name, offline tests for it that fail without the fix, QUIET and an empty Atom feed still alive. The evidence is in reach inside `owns`: the answer itself (an empty arXiv channel has single metadata children and declares skipDays; a renamed feed has a run of repeated unknown children) or the registry (an optional key on the one digest, empty staying a fault for the other twenty, which loads today without a version bump).
'''

[[findings]]
severity = "medium"
file = "tests/test_news.py"
text = '''
`print("\nAlive with nothing new today: ...")` is captured. The nightly runs `uv run pytest -m integration tests/test_news.py`, addopts are `-q -ra`, and pytest shows captured output of a passing test only with `-rP` or `-s`: I ran the nightly's exact command against a local registry of a full feed, the quiet digest and the renamed feed and got `.` and `1 passed, 34 deselected`; the two lines appear only when I add `-rP`. So the changelog's `a feed that is alive with nothing new is printed rather than failed` and the pull request's `the nightly prints every quiet feed by name, so that shows up as a feed quiet every single night` are not what happens on a green night. .github/workflows/nightly.yml is not in `owns`, so the flag is not the builder's to add; a `warnings.warn` per quiet feed lands in the warnings summary of a passing run and is. Make it visible or stop saying it is.
'''

[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
`check_one` spells `fetch_one`'s request a second time: the same `Request(src.url, headers={"User-Agent": USER_AGENT})`, the same `urlopen(req, timeout=timeout)`, the same noqa. AGENTS.md: one helper per concept. One `_get(src, timeout) -> bytes` under both would keep the user agent and the S310 reasoning in one place.
'''

[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
`liveness()` parses the body with `ET.fromstring` and then hands the same bytes to `parse()`, which parses them again and builds every Item in full (hash, entity and tag stripping, dates) only to be counted: 1210 for openai-news, 862 for huggingface-blog, twice each per night. Harmless at 13 s for the whole registry; worth folding in when the first finding reshapes the function.
'''

[[findings]]
severity = "low"
file = "tests/test_news.py"
text = '''
The comment over QUIET ends `and the nightly check used to read this as death`. AGENTS.md: comments state constraints and why, never narrate changes. The first half of the sentence (arXiv declares the gap with skipDays) is the constraint and is enough.
'''

