Dead, rightly, each line `id (url): what`: 404, 410 and 500 (`HTTPError: HTTP Error 404: Not Found`), a closed port (`URLError ... Connection refused`), a name under .invalid (`URLError ... nodename nor servname`), a server that accepts and never answers (`TimeoutError: timed out` after the 1 s I gave it), a body cut short of its Content-Length (`IncompleteRead`), well-formed HTML and a 302 landing on it (`not a feed: the root element is 'html'`), everyday HTML, JSON and an empty 200 (`not XML: ...`), RSS 1.0 under rdf:RDF (`not a feed`, and the parser never read those), items whose title and link were renamed (`format changed: 1 entries, none of them with a title and a link this parser could read`), items whose only link is `javascript:` (same sentence, true enough).
