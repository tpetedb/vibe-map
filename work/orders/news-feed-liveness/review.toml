[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
`_renamed_entries` reads only the direct children of the channel (or of the Atom feed) and needs a run of two. For the one source that rests, four renames still answer `alive, nothing published yet today`: a single renamed entry, renamed entries one level down (`<items><article>...`), renamed entries beside `<channel>` instead of inside it, and a rename to a local name on the exclusion list (`<x:link>`). For the other twenty the registry rule calls all four dead, and for arXiv the QuietFeed warning on a weekday night is what is left. In the other direction a resting digest whose quiet channel repeats a child that is not on the list (two `dc:creator`) is reported as a format change; the real empty arXiv channels repeat nothing, and that mistake is loud and names the element. I would land it: every rename round 1 named is caught, and so is a real 214-entry body. A follow-up could count over the whole tree below the feed body, or treat quiet on a day the feed's own skipDays does not name as a fault.
'''

[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
`rests=str(raw.get("rests", ""))` takes anything. `false`, `null`, `0`, a list and `"   "` all load, become `'False'`, `'None'`, `'0'`, `"['x']"`, `'   '`, and count as resting, so the natural way to write "this one does not rest" switches the empty-is-a-fault rule off for that source. The loader refuses a bad kind and a URL that is not https by name; a `rests` that is not a string with a reason in it belongs in the same refusals. Low because the shipped file is guarded: with `"rests": false` on openai-news in my copy, test_the_registry_says_which_source_rests_and_why fails in the fast battery.
'''

[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
`day` and `hour` in REPEATED_META never match: they live inside `skipDays` and `skipHours`, and `_renamed_entries` reads direct children only, where each of those two appears once. Taking both off the list leaves all 43 offline tests green, and the comment's `a digest lists the days and hours it rests` describes elements the function never sees. Two dead entries and half a sentence.
'''

[[findings]]
severity = "low"
file = "vibemap/news.py"
text = '''
ENTRY_TAGS is introduced as `The two elements this parser reads as one piece of news`, but the parser does not read it: `items_of` still spells `root.iter("item")` and `root.iter(f"{ATOM}entry")` itself. AGENTS.md: one helper per concept. The day the parser learns a third element the count in `liveness()` can silently disagree with it.
'''

[[findings]]
severity = "low"
file = "tests/test_news.py"
text = '''
Every use of `serve_feed` costs 0.50 s in teardown (`--durations` shows it on each one): `httpd.shutdown()` waits out `serve_forever`'s default poll interval. Thirteen uses, about 6.5 s of the fast battery spent waiting on a timer. `serve_forever(poll_interval=0.01)`, or one server for the module with routes per test, gives it back.
'''

