[[findings]]
severity = "medium"
file = "src/game/16-artifacts.js"
text = """
F2 does not reproduce on main, was reported as reproduced, and the comment that justifies the \
fix says something untrue. Inter and JetBrains Mono left the stylesheet in f00a348, which has \
been on main since 2026-09-19 18:32; the computed family of the step is system-ui on main and \
on the branch. I rendered 'GET /coffee -> 200 --region' at 40 px in system-ui and in \
ui-monospace, once with ligatures normal and once with none, in Chromium and in WebKit on \
this Mac: the two element screenshots are the same bytes in both browsers and both fonts, and \
the zoomed step 4 is identical on main and branch. So SF does not draw '->' as an arrow or \
'--' as one dash; what looks like a long dash in the WebKit shots is SF Mono's wide hyphen, \
and font-variant-ligatures:none leaves it exactly as it was, in the terminal too. The order's \
rule is that a finding that does not reproduce is rejected with the evidence. Keeping the \
rule as a guard for a fork that puts a ligating font back is defensible, but then the comment \
in artifactReal and the one over #art-term have to say that, not 'Inter and SF draw', the \
pull request has to stop saying all seven reproduced, and the test should own up to being a \
guard on a style."""

[[findings]]
severity = "low"
file = "src/game/16-artifacts.js"
text = """
The live region is handed the whole transcript again on every line when motion is on. runDemo \
appends with el.textContent +=, which replaces the one text node each time: a MutationObserver \
on #art-term during the cafe's first demo records added nodes of 30, 57, 106 and 188 \
characters. A reader that speaks additions gets line 1, then lines 1 to 2, then 1 to 3, then \
all four. Only reduced motion gets the 'one announcement' the comment promises. Appending a \
node per line, or announcing once at the end, would do it. Reasoned from the mutations, not \
heard in a screen reader."""

