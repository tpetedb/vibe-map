# A review of one order, by someone who did not build it. Copy to
# work/orders/<id>/review.toml. `just work-review <id>` prints what to read
# and the commit to put in `reviewed`.
v = 1
order = "issue161-minimap"
by = "claude-reviewer-161"
# The commit you read. If a file the order owns changes after it, the review
# no longer counts and has to be done again.
reviewed = "4fe80d6b729a3a44055395516c68d2ded5fe279a"
# accept, or improve (then the findings say what).
verdict = "accept"

# One row per criterion of the order, checked or judged. A checked criterion
# passing is not enough: say whether the command really proves the text.
[[criteria]]
id = "c1"
verdict = "pass"
evidence = '''
Round 2, delta d95b938..4fe80d6. Ran the check in the worktree at 4fe80d6: `uv run pytest -q tests/test_minimap_short_window.py`, 5 passed. The command proves the sentence. The desktop test measures the canvas and the Bigger button against #zoom with a full rectangle test at 800x640, 720x600 and 640x480, and pins right == 790 at 800x640. The phone test opens the map with its Map button at 375x667 and 320x568 on a touch context and pins both the map and the toggle to right == width - 10. It pins the corner, not the vertical order; I measured that (375x667: toggle 194-238, map from 246).
Red on the old code, in scratch copies under /tmp/rev161b with the new test file and the game rebuilt there. On the round 1 source (src/game/32-minimap.js from d95b938) the run is `...FF`: both phone cases fail (map right 309 and 254). With the fix removed (32-minimap.js from the merge base 99e6db7) the run is `.FF..`: 720x600 fails (Bigger meets zoom) and 640x480 fails (map meets zoom); 800x640 and the phones pass, as they should.
Across the matrix on the new build (640/1024/1440 wide by 360/480/540/600/900 tall) the desktop boxes are identical to the round 1 build: zoom is clear at every size, and the map keeps its corner wherever nothing meets (1024x600 right 1014, 1440x600 and 1440x900 right 1430, 640x900 right 630). Phones at 320x568, 390x844 and 560x700 are identical to the build with no fix.
Context, not a finding: tests/test_media.py's 640x480 case compares vertical extents only and stays green. It is Team Codex's to update when #161 joins the train.
'''

