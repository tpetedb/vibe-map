file = "src/game/32-minimap.js"
text = '''
For a follow-up, not blocking: the clearance is taken from #zoom alone. On a touch screen wider than MM_PHONE (844x390 landscape) the map still moves, and the wider #jump (56px against 44) keeps a 4px strip of its box under the moved map (map right 778, jump left 774). Before this order the map covered that button whole, so this is a gain, not a regression.
'''

