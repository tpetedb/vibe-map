Also ran `uv run pytest -q tests/test_changelog.py`: all pass. `tools/changelog.py draft` now lists "- Keep the minimap and Bigger button clear of the zoom controls in short browser windows." under Fixed. ruff check and ruff format --check are clean on the test file.
'''

[[criteria]]
id = "c3"
verdict = "pass"
evidence = '''
Looked at the new build's screenshots, played state, campus, Chromium, dpr 1: /tmp/rev161b/new-640x480.png, new-1440x900.png, new-375x667-touch.png.
640x480: the map at 442-578, 8px clear of the zoom column, with plus, fit, minus and Bigger all free. 1440x900: the map in its corner. 375x667 with the map open: the map sits under its Map toggle in the corner, exactly as before this order.
Usable: a click on the next stop's plot on the moved map at 640x480 (plot 6 at 486,157) walks Lotte there. Bigger then Smaller brings the map back to 442-578, and the test now asserts that. Resizing 640x480, 1440x900, 640x480, 800x640, 640x480 moves the map out, back to the corner, out, back and out. Left-handed leaves the map in its corner. No page errors.
Round 1 findings:
- The fragment is now a bullet (fixed).
- Phones are desktop-only now: map and toggle stay aligned at 375x667 and 320x568 (fixed).
- mmLayout reads #zoom's box before any style write and works out the map's and Bigger's boxes from y, D, under and MM_TAP (fixed).
- A constraint comment was added (fixed; see the low nit below).
- The test uses game_page with no fixed sleeps, asserts page errors, and asserts the Smaller return (fixed).
'''

# What you found, most severe first. severity: high, medium, low.
