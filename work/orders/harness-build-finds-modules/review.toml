[[findings]]
severity = "low"
file = "tools/build.py"
text = '''
The comment above MODULE_NAME says 90-boot.js sorts last because it reads localStorage and paints the title screen. With src/galaxy/ present that holds only inside src/game/: a galaxy module lands directly after boot's last byte, which is what the order asked for. But 90-boot.js runs at load (applyTheme(), init3d() and applySettings() are called at its top level), so every top-level const or let of a galaxy module is still in its temporal dead zone when boot runs; only function declarations are hoisted through the one function the game is wrapped in. Nothing breaks today because the folder does not exist. For the orchestrator and galaxy-v0, which owns both src/galaxy/ and 90-boot.js: either boot never touches a galaxy binding at load, or the folder order wants another look before that order starts. The comment should state the constraint either way.
'''

[[findings]]
severity = "low"
file = "tools/build.py"
text = '''
The docstring of _modules says everything the folder holds is a module and that a part is never quietly left out of the game. Two things still are. A subfolder: src/game/sub/24-example.js builds green and is not in the game (is_file() skips the directory), while sync_fork_source.py, which walks src/ with rglob, carries it into the mirror. And a deletion: with 31-animate.js moved away the build exits 0 and writes a game 14 KB smaller, where main stopped with FileNotFoundError; only the six modules named in INJECT_BEFORE and MADE are missed by name. In a checkout `build.py --check` and the mirror check catch a deletion, in a learner's fork nothing does until the page throws. Both are the price of finding modules instead of listing them and I would land it; for a follow-up, refuse a directory in a module folder the way a stray file is refused. The same seam shows with a dotfile: the build skips src/game/.DS_Store, the mirror check reports it as stale.
'''

