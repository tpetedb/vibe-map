[[findings]]
severity = "low"
file = "tools/ci_shards.py"
text = '''
browser_test_files() throws away pytest's return code. A browser test file that does not import and that no pattern claims simply drops out of the set: with tests/test_game_broken.py (`import a_module_that_does_not_exist`, one `game` test) in the clone, `--files smoke` exits 0 without it, the split does not list it, and the guard passes. On main such a file was named in a list and reddened its shard. Nothing lands because of it, since the other required job's own collection stops with `Interrupted: 1 error during collection`, but the browser context reports green for a battery it did not fully run, and the comment in _files_of says a split the runner cannot trust is a hard stop. For a follow-up: a non-zero exit of the collection is a problem line in `--files` and in the guard.
'''

[[findings]]
severity = "low"
file = "tests/test_repo.py"
text = '''
The entry point CI runs has no test. The four tests call assign() and problems(); `--files` with its three refusals (unknown shard, a split with problems, an empty shard) is exercised only by the workflow, and only on its happy path. I ran the refusals by hand and they hold, so this is a follow-up: one test that runs `tools/ci_shards.py --files smoke` and reads the line, one that gives it a name the matrix does not have.
'''

