verdict = "pass"
evidence = '''
In the clone I added tests/test_game_example.py with one test that takes the `game` fixture, and nothing else (`git status`: one untracked file). `python tools/ci_shards.py`: `smoke (default): 5 files` with the example in it; `--files <shard>` for all seven: the example once in smoke, zero times in the other six. The whole of tests/test_repo.py: 31 passed, 1 skipped, which includes the guard, the default-shard test and test_the_required_context_is_its_own_job_and_keeps_its_name. Then I ran the smoke step as the workflow spells it, under `bash -e`: it printed `smoke runs:` with the example in the list and pytest ran it, 28 passed (main's count for smoke) plus my one test, which failed on my own naive assertion and so proved it was executed and can redden the shard.
Then I tried to break it, each time through the guard and through `--files smoke`. A pattern that matches nothing (`tests/test_game_nothing*.py` on phone): guard fails and names shard and pattern, `--files` exits 1, and under `bash -e` the step stops before pytest. A file matched by two patterns (`tests/test_game_q*.py` added to phone): `in more than one shard (phone, qol)` for both qol files, exit 1. A browser test whose name follows no convention (tests/test_zzz_browser.py): lands in smoke, guard green. A non-browser test whose name matches a pattern (tests/test_game_qol_pure.py): not handed to qol, because only files pytest collects under `-m "browser and not integration"` are assigned, and the non-browser job's marker expression collects it. An unknown shard name: exit 1 with the list of names. `--verify` as the aggregator spells it (`uv run --no-project --with pyyaml`): no receipts names all seven, seven receipts gives `all 7 shards passed`, a failed matrix is refused. The one thing I could get past it is the first finding.
The pull request's own run on the same owned files (35557619256, 802809d): all seven shards and the aggregator green, each shard's log carries its `runs:` line, and the passed counts equal main's run 35556457380 shard by shard: smoke 28, ui 50, phone 45, bridges 57, panels 72, qol 54, webkit 33, together 339, which is what I collect locally. Wall time in minutes, this run and main: smoke 10.1 and 10.2, ui 17.9 and 18.7, phone 18.3 and 15.1, panels 22.7 and 17.1, webkit 28.5 and 29.5, bridges 30.3 and 15.5, qol 34.7 and 35.0. Bridges ran the same 57 tests, each about twice as slow in the same ranking (pet chooser 175s against 85s, bridge walk 93s against 43s), so that is the runner and not the split; main's two latest runs differ from each other by as much (qol 18.6 and 35.0). Smoke is the shortest leg by a wide margin, so it is the right home for the default.
