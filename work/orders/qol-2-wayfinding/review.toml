[[findings]]
severity = "high"
file = "src/game/30-input.js"
text = '''
Walk there does not always get there, and when it does not, it never ends. `walkTo()` hands `aim()` a point and the frame loop steers at it in a straight line, which was fine for a tap a few paces off and is not for a walk across an island with a building in the middle. Through the palette's own Shift and Enter, standing at stop 7 of the campus and asking for `20:00, Data Warehouse`: the walker is pinned against the Hospitality Hub at (2.41, 1.33), and after 30 s `__walk()` still says has true, marker 1, line true, speed 0.15, the arrow still says 23 m, and nothing tells the player. I then walked every ordered pair of stops on every island (an Eulerian tour, 56 walks an island, real GPU). Counted pairs that never end: campus 2 of 54 (7 to 3, 6 to 2), winter 3 of 53 (4 to 8, 7 to 3, 6 to 3), desert 1 of 54 (7 to 3), prod 1 of 55 (7 to 3). One more on the desert, 6 to 7, ends 1.9 m from the plot because the shore branch calls `clearAim()` and says nothing; hurrying at the fast speed on the winter island, 7 to 6 ends 7.7 m short the same way. Before this order a stuck walk at least lost its marker after a second; now the marker and the line stay lit for as long as it lasts, and see finding 2 for what each of those frames costs. A walk that stops closing the distance has to end and say so, or go round, and the test file needs one walk that crosses the island and arrives.
'''

[[findings]]
severity = "medium"
file = "src/game/31-animate.js"
text = '''
`tickPath()` allocates on every frame of a walk. It calls `computeLineDistances()`, and in the vendored three r128 that is `n=[0]` and `setAttribute("lineDistance", new Float32BufferAttribute(n,1))`: a new array, a new typed array, a new attribute, and on the next render a new GL buffer for it, with the old one left for the garbage collector. Measured by counting `createBuffer`: during a `walkTo` the branch made 94 buffers in 90 frames and deleted none, on the desktop and on the Android profile alike; main makes 0 during a walk; standing still both make 3 in 120 frames. In the stuck walk of finding 1 that is 1806 buffers in 30 s with no end. The comment above the call says the distances are `the one thing recomputed`, which is not what the call does. The line has two points, so its distances are 0 and its length, and they fit an attribute made once with the geometry.
'''

[[findings]]
severity = "medium"
file = "src/game/31-animate.js"
text = '''
With reduced motion on, a walk survives the change of island. `setWorld()` skips the flight and calls `buildWorld(id)` directly, so neither `clearAim()` this order added is on that path. Pressed the real World button during a `walkTo(5)` with `reduced_motion: reduce`: on the winter island `__walk()` says has true, marker 1, line true, the toast still reads `Walking there, 21:30, Stakeholder Alignment Bridge`, a campus stop, the dashed line runs off towards the campus coordinates, and the walker goes from (3.0, 3.8) to (3.6, -3.4) with nobody steering. Without reduced motion the same steps end the walk. Main has the stale walk underneath too (its walker drifts the same way), but there the marker had faded and there was no line; here the pull request says `every place a walk ends now goes through one helper, clearAim(), including a crossing and a flight, which is what stops a marker being left lit over an island that is no longer there`, and for anyone with reduced motion that is not so. `setWorld` is in a file this order does not own; the frame loop it does own already notices a rebuilt scene in `pathLine()`.
'''

[[findings]]
severity = "medium"
file = "tests/test_game_qol_wayfinding.py"
text = '''
Two of the fixes have no test that fails without them. With both `clearAim()` calls taken out of `22-archipelago.js` and the game rebuilt, the whole file passes apart from the tests my other reverts broke: nothing crosses a bridge or flies with a walk on. And `test_the_arrow_never_takes_a_tap_from_the_zoom_buttons` passes with `pointer-events:auto` back on `#guide`: in its state the arrow sits at x 20 on the left edge and the zoom buttons are on the right, so the tap never meets it and the test cannot fail for the reason in its name. The property is held today only by the `elementFromPoint` line in the desktop arrow test. The test wants a state in which the arrow is where the zoom buttons are, or an assertion on the arrow itself on the phone.
'''

[[findings]]
severity = "medium"
file = "src/game/31-animate.js"
text = '''
The line to the marker is in the scene and hardly on the screen. It is a WebGL line, so one device pixel wide whatever the screen, in `PALETTE.blueBright` at opacity 0.7, and on grass that is a difference of hue and almost none of lightness. From my own screenshots of a walk on the campus, the line's most visible pixel against the grass beside it: (41, 140, 126) on (78, 136, 67) on the Pixel profile, a contrast ratio of 1.04 to 1, and (25, 152, 167) on (122, 174, 91) on the desktop, 1.32 to 1, where 3 to 1 is the usual floor for a graphic. At 2.6 device pixels to the CSS pixel it is a hairline I had to crop and enlarge to find. On the winter island's snow it is plain. The two marker tests assert `__walk().line === true`, which is the object's `visible` flag and says nothing about whether anybody can see it; findings.md quotes `a clear visual path on the ground`. The marker itself, a ring, reads well on every island.
'''

