[[criteria]]
id = "c3"
text = "Every generated file is in sync with its source."
check = "for c in build regen_tree gen_cookbook sync_template sync_fork_source gen_syllabus; do uv run python tools/$c.py --check || exit 1; done"

[[criteria]]
id = "c4"
text = "Every finding in findings.md is either fixed with a test that fails without the fix, or rejected with the evidence that it does not reproduce on main. None is silently skipped."
judge = "reviewer"

[[criteria]]
id = "c5"
text = "Screenshots of every changed surface were taken on the desktop and both phone profiles and looked at; copy keeps its voice (Rolinda plain, everyone else corporate), no em-dashes, no emoji."
