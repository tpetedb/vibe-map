id = "c1"
text = "At 375x667 and 320x568, opening and enlarging the map leaves the canvas, Map and Bigger or Smaller controls clear of the zoom column; map plotting and the controls still work. The 640x480, 720x600 and 800x640 desktop clearance stays intact."
check = "uv run pytest -q tests/test_minimap_short_window.py"

[[criteria]]
id = "c2"
text = "The built game and installed fork source match their source."
check = "uv run python tools/build.py --check && uv run python tools/sync_fork_source.py --check"

[[criteria]]
id = "c3"
text = "The expanded phone map and zoom controls remain visually separated and usable at compact widths."
judge = "reviewer"

