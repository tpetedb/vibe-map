v = 1
id = "galaxy-seam"
title = "The islands become an experience behind a small contract, and four golden pictures prove nothing moved"
team = "scene"
branch = "feat/galaxy-seam"
goal = "galaxy"
# Whoever builds this writes their name here; a review by the same name does not count.
builder = "builder-galaxy-seam"

owns = [
  "src/game/24-experience.js",
  "tests/test_game_experience.py",
  "tests/golden/",
]
cross = []
needs = ["harness-build-finds-modules"]

[[criteria]]
id = "c1"
text = "The experience tests pass, including the four golden pictures."
check = "uv run pytest -q tests/test_game_experience.py"

[[criteria]]
id = "c2"
text = "Lint, style, the sink guard and the whole non-browser battery pass."
check = "uv run ruff check -q . && uv run ruff format --check -q . && python3 tools/checks.py style && python3 tools/checks.py sinks && uv run pytest -q -m 'not browser and not integration'"

[[criteria]]
id = "c3"
text = "Every generated file is in sync with its source."
check = "for c in build regen_tree gen_cookbook sync_template sync_fork_source gen_syllabus; do uv run python tools/$c.py --check || exit 1; done"

[[criteria]]
id = "c4"
text = "The golden pictures are a real guard and not a flaky one: the reviewer changes one colour in `src/game/20-worlds.js` in a scratch copy and the test fails; runs the test three times unchanged and it passes three times; and reads how the tolerance was chosen for a software renderer on a CI runner whose fonts and rasteriser differ from a Mac's."
judge = "reviewer"

[[criteria]]
id = "c5"
text = "Nothing in the island game changed: no existing module was edited, the built game differs from main only by the new module, and every function of the contract is exercised on `islands` through the contract by a browser test."
judge = "reviewer"
