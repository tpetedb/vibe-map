The primary origin's year and its whole sentence are not in what a person reads at the \
source. I rendered the page in Chromium and searched the body text: 'July 23, 2016', 'It \
was Summer 2013', no 2014. 'originally developed at Google and released as open source in \
2014' exists only in the page's meta description and social share tags, which is what a \
fetch tool summarises and a learner never sees. The same defect was a low on the schema \
order for a street in a place file; here it is the year and the line of a primary origin, \
the one sentence a dome gets. A page that says it in plain sight exists: kubernetes.io's \
ten year post, which I opened, reads 'on June 6th, 2014, the first commit of Kubernetes was \
pushed to GitHub'. The place needs a second look too. The article names no office (a room \
with Urs Hölzle, a shuttle ride). SiliconANGLE, 17 December 2018, opened: Joe Beda and Craig McLuckie \
'migrated to Google LLC's lab in Seattle a few years later and worked on a little-known \
project at the time to build a container orchestration tool'; Joe Beda on The Podlets, \
opened: 'I then went to Google in the office up here in Seattle. It was actually in \
Kirkland'. The settled reading takes the town from the place file when nothing contradicts \
it, and the builder refused docker-palo-alto on exactly this ground. Either a source that \
puts the work in Mountain View, or say in the pull request why the dome stands there and \
wish for the Seattle office on issue 168."""

[[findings]]
severity = "medium"
file = "vibemap/data/topics/core/headless.toml"
text = """
Also vibemap/data/topics/core/readme.toml. The two Bell Labs primaries stand on TUHS pages \
that name no actor at all. The cron page's text is its path, 'V6/usr/man/man8/cron.8', a \
list of similar files and the manual source; the /usr/doc page is 'V7/usr/doc' and a file \
table. Neither carries the word Bell, a person or an organisation, and the title tag is \
empty (grep on the raw HTML; the one Unix on either page is 'Mini-Unix', the name of \
another tree in the cron page's compare list). c5 asks for 'the year, the place, the \
people or organisation', and the reading the schema's review settled on takes the town from \
the place file but the actor from the origin's own page. Here the step from 'V6' to Bell \
Labs is made by the reader: it is on TUHS's tree index ('These are the versions of Unix \
developed at Bell Laboratories', opened), which is not the page cited, and the V7 README \
itself says only 'The UNIX Programmer's Manual, 7th Edition'. True and plausible, which is \
what the criterion rules out. The lines add 'Unix' to what the page says ('the V6 Unix \
manual page', 'The V7 Unix tree'). A source whose own text ties the edition to Bell Labs, \
or a line and a place that claim no more than the page does."""

