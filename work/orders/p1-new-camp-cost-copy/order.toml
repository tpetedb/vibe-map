[[criteria]]
id = "c1"
text = "Focused onboarding tests prove that vibe new's closing message and the generated camp AGENTS file name the learner as owner of the repository, subscription and usage, distinguish the free parts from possible costs, and tell the learner to create a zero Codespaces budget before use with Stop usage enabled."
check = "uv run pytest -q tests/test_onboarding.py -k 'vibe_new_names_ownership_and_cost or template_agents_names_ownership_and_cost'"

[[criteria]]
id = "c2"
text = "Lint, style, the sink guard and the whole non-browser battery pass."
check = "uv run ruff check -q . && uv run ruff format --check -q . && uv run python tools/checks.py style && uv run python tools/checks.py sinks && uv run pytest -q -m 'not browser and not integration'"

[[criteria]]
id = "c3"
text = "Every generated file is in sync with its source."
check = "for c in build regen_tree gen_cookbook sync_template sync_fork_source gen_syllabus; do uv run python tools/$c.py --check || exit 1; done"

[[criteria]]
id = "c4"
text = "The new copy is plain and brief, does not imply that this project pays for a learner's agent or Codespace, does not promise that a generated camp can become a template, and leaves provider-specific and online-mode choices to issues 92 and 82."
judge = "reviewer"
