[[findings]]
severity = "medium"
file = "src/game/18-avatar.js"
text = '''
`unlock()` now calls `buzz()`, and `unlock()` is reached from `achCheck()`, which `tickAvatar` runs once a second from the frame loop, title screen included. So Chrome is asked to vibrate before the player has touched the page, and it says so at error level. Measured in Chrome for Testing over raw CDP with no gesture given: a returning record `{"doneW":{"campus":[1]}}` unlocks First light at the title, `navigator.userActivation.hasBeenActive` is false, and the log has "Blocked call to navigator.vibrate because user hasn't tapped on the frame or any embedded frame yet" (source intervention, level error). A brand new player with the hour at 23 gets the same from Night owl, so after eleven at night this is every first visit in Chrome, desktop and Android. Main logs nothing there. The order's tests cannot see it: Playwright's evaluate hands the page user activation (`hasBeenActive` was already true before any click in a Playwright probe), so the call is allowed and silent. The proposal's own rule is that the buzz "fires in the click handler, never from a frame", and the bar in AGENTS.md is zero page errors. The buzz must not reach `navigator.vibrate` on a page nobody has touched, and a test has to show it without being given activation by the harness.
'''

