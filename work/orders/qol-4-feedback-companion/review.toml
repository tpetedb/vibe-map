[[findings]]
severity = "low"
file = "src/game/18-avatar.js"
text = '''
The mark's whole look is an inline `cssText` of twelve declarations in a script, because `src/style.css` is not in owns. It reads the tokens, so more contrast reaches it, but it is a style the stylesheet does not know about: the forced colours rule that names `.tst` cannot name it, and the next person to restyle the toasts will not find it. When B2 moves the toasts, the mark's rule belongs next to theirs. In the same spirit, `NOTE_CAP` is declared in `18-avatar.js` and read by `load()` in `00-state.js`; it works because `load()` is first called from `90-boot.js`, but `EVENT_CAP` sits in the state module next to the list it caps, and this one does not.
'''

