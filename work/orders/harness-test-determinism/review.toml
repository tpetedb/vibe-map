file = "tests/conftest.py"
text = '''
The write rule reaches less than the sentence that now advertises it. writes_only_to_out() replaces `screenshot` on the one page game_context() hands out. In a clone, inside game_context(): `page.locator("body").screenshot(path=<a temporary file>)` wrote the file, and a second page from `page.context.new_page()` had the clock and the record, which hang off the context, and wrote outside too. The source guard leaves the same door open from its side: it accepts any path expression that holds a bare name `OUT`, and tools/media.py, which test_media.py imports, has an OUT of its own that is docs/media. A planted test with `from tools.media import OUT` and `game.page.locator("#vault").screenshot(path=str(OUT / "vault.png"))` passed `test_no_test_names_its_own_path_for_a_screenshot`. And the tool's two entry points, screenshots(browser, url) and gameplay_gif(browser, url), take a browser and open contexts of their own inside tools/, where neither guard reads: a test that called one would write docs/media with nothing said. What the rule does hold is the tool's page-taking helper, `_sheet(page, ...)`, which goes through `page.screenshot(path=...)` and would be refused. No test does any of this today (the three browser tests of test_media.py use _load, _start, _settled, _stage, _signpost, _tap_towards, _still and _walked, none of which takes a picture), so nothing is written, and that is why this lands. Wanted in a follow-up: hold the locator's screenshot and later pages of the context to the rule, have the source guard ask for the OUT of tests/conftest.py, or say `a page screenshot` in the docstring of game_context(), the fragment and the pull request, which say `a picture only ever lands in tests/out` and `cannot write outside tests/out`.
'''

