[[findings]]
severity = "low"
file = "tests/conftest.py"
text = '''
The comment above SHOT_MS explains the CI failure with a laptop's ratios again, in smaller print than last time. It says a runner drawing a fifth of a frame a second needs thirty seconds for a picture of five to six frames, `which is ... what ran out twice in one job (run 35573982127 ...)`. In that job the 25 frame first landing had just fitted inside its 30 s, so the page was drawing at least 0.8 frames a second, and the frame model gives the picture under ten seconds; it took over thirty, twice. So on the runner a capture costs something frames do not account for, which is what the second review said and what the scene team's note (`two costs with one root`) now says the opposite of. The cheaper capture is in the same position: halved on my laptop as on the builder's (5.8 to 8.0 s against 3.3 to 4.0 s at 1.3 frames a second), but on the runner the Android zoom test took 231 s at this head against 187 s and 242 s on main (runs 35574491132 and 35564113814) and 241 s on this branch's first run, all at device scale and all on runners where the other camera tests took what they took here; the one 123 s (run 35578906498) was a runner on which every camera test ran in half the time. No saving shows there. Neither budget depends on the explanation, the failure will now carry the frames that settle it, and a smaller artifact is a gain anyway, which is why this lands. Wanted in a follow-up: the comment, the changelog line and the note say what is known (30 s ran out twice on the runner while the landing beside it fitted; why is open) and the taste half goes with it: the block is thirteen lines where AGENTS.md asks for one or two, cites a run id, and `the device scale it used to be taken at` narrates a change.
'''

