[[findings]]
severity = "medium"
file = "tests/test_game_camera.py"
text = '''
D4 asks which wait expires, and this pull request's own CI has answered it differently from the pull request. Run 35573982127 is fa8c01c, which is the test code of aaa2552 plus the first review file, so the named waits were in place. Its webkit shard has `test_every_zoom_level_holds_the_phone_budget[game_android]` red twice in one job, first attempt and retry, and both times the wait that ran out is neither of the two the order names: `playwright._impl._errors.TimeoutError: Page.screenshot: Timeout 30000ms exceeded`, call log `taking page screenshot, waiting for fonts to load, fonts loaded`, raised from `game.screenshot(f"camera_{fixture}_zoom_{level}", clip_height=915)` through `guarded` in tests/conftest.py. The level wait, the 30 s landing and frames(2) had all passed. The run's `screenshots-webkit` artifact holds the four camera_game_webkit_iphone_zoom_* pictures and not one camera_game_android_zoom_*, so it is the first screenshot, at zoom -1: the same `the Android variant saved none` that issue 148 describes. That shard finished at 08:08 UTC; e03be7e was committed eleven minutes later and says nothing of it, nor does the pull request, whose body still states as fact that the landing `is what ran the Android leg of the zoom budget test out`, nor does issue 148. That sentence rests on a laptop under artificial load; the only CI occurrence since the waits got their names says otherwise.
My numbers do not explain it, and that is the point. Here the Android screenshot at zoom -1 takes 2.1 s, in which the page drew 7 frames, against 1.2 s at the three other levels and 0.12 s in WebKit. It is the dearest of the four, but at a laptop's ratios the 25 frame landing would run out long before it. On the runner the landing fit inside its 30 s and the screenshot did not fit inside Playwright's, twice running, so the runner's software renderer pays something for a 412 by 915 picture at 2.625 device pixels that a Mac does not, and only a number taken on the runner will say what. The screenshot is the one wait in that loop with no name, no frame count and no budget of its own, and LAND_MS would not have saved either attempt.
Wanted: read that run and record on issue 148 which wait it was; take the picture inside a named wait in GamePage.screenshot(), the one helper, so the next occurrence says how many frames the page drew; then either give the screenshot a budget with the measured number behind it or make it cheaper, and put the performance half to the scene team next to the glide note. The pull request's sentence about what ran the Android leg out wants correcting either way. As it stands one of this branch's three CI runs has the browser battery red on the very test D4 is about, under a changelog line that says these tests no longer depend on where they run.
'''

