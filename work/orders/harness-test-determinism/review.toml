[[findings]]
severity = "medium"
file = "tests/conftest.py"
text = '''
GamePage.toasts() returns the first toast of every page twice. With the repaired-record state the game's own count `window.__toasts()` is 1, one `.tst` is on screen, and toasts() has two identical entries; after a second toast (First sit) the game says 2 and the record 3. It is the same in all four fixtures. Cause: toast() creates `#toast`, appends it to the body and appends the `.tst` to it in one task, so the observer is handed both records together: for the added `#toast` it runs `querySelectorAll('.tst')`, which already finds the notice, and for the added `.tst` it notes it again. Later toasts are noted once because `#toast` is already there. On main this was a private helper that only ever asked `some(...)`; here it is the public list the docstring calls `every toast the page has raised`, and the follow-up that converts tests/test_game_bottles.py and tests/test_game_ui.py will build on it. A count, an order or an `exactly one` written against it is wrong from the first toast. Wanted: each notice recorded once, and a test that fails today, for instance the record's length against `window.__toasts()` after the first and after the second toast.
'''

[[findings]]
severity = "medium"
file = "tests/test_harness_determinism.py"
text = '''
`test_no_browser_test_reads_a_toast_off_the_screen` fails for the one shape main had and passes for the rest. In a copy I wrote a browser test ten ways and ran the guard after each. Caught: `game.page.text_content("#toast .tst")`. Green: `game.page.locator("#toast .tst").text_content()`, `locator("#toast .tst").first.inner_text()`, `el = page.wait_for_selector("#toast .tst")` then `el.text_content()`, `page.evaluate("document.querySelector('#toast .tst').textContent")`, `wait_for_selector('#toast .tst:has-text("Picked up")')`, the selector held in a variable, `text_content(".tst")`, `inner_html("#toast")`, and `expect(page.locator("#toast")).to_contain_text(...)`. The guard only looks at a call whose own positional string starts with `#toast` and whose own name reads text, so a read one attribute further along the chain is invisible to it, and the locator chain is how Playwright asks to be used and how tests/test_game_ui.py:416 already reaches for a toast. D2 asks for `no browser test reads #toast text directly`. Wanted: a call that names `#toast` (or `.tst`) is the finding unless it is on a short list of things that are not a read (`is_visible`, which tests/test_game_qol_settings.py:371 uses rightly), with the locator, handle and evaluate shapes as cases of the guard's own test.
'''

