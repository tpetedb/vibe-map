[[findings]]
severity = "medium"
file = "vibemap/data/topics/core/unix.toml"
text = """
The echo carries year = 2026 and the page does not. \
https://www.opengroup.org/openbrand/register/ lists 'Apple Inc.: macOS version 26.0 Tahoe' \
with no date at all, and the certificate it links (brand3725.htm) says 'Registered on: \
29-Aug-2025'. 2026 is the year the page was read, not a year the source gives, and the line \
goes stale the day the next macOS is registered. docs/TOPICS.md teaches the same origin as \
its model example."""

