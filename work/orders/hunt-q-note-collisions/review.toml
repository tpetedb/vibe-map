[[findings]]
severity = "medium"
file = "tools/build.py"
text = '''
The duplicate-title guard at lines 187-188 recognizes only the repository's exact compact spellings: an object key must be at column zero and immediately followed by `:{t:`, and a dynamic assignment must be exactly `NOTES["..."]` apart from whitespace before `=`. Valid JavaScript such as `"Unix and the terminal": {t:...}` is invisible to `_NOTE_KEY`; with that duplicate in `50-notes.js`, the reviewed build exits 0 and silently lets the handwritten note overwrite the generated one. If an exact dynamic duplicate is present too, the error omits the handwritten source. The tests at lines 95-116 repeat the accepted spellings, so c1 and c5 stay green while the promised collision protection is bypassed. Make title discovery insensitive to harmless JavaScript whitespace (and cover the variants) or derive the namespace from a representation that does not require parsing source formatting.
'''
