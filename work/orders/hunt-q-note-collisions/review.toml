[[findings]]
severity = "low"
file = "tests/test_hunt_q.py"
text = '''
`test_q3_every_tree_note_in_the_vault_lists_its_topic_docs` skips a tree node whose vault note does not exist (`if not note.exists(): continue`), so a missing note passes silently. It also rebuilds the Docs line by hand, `", ".join(f"[{t}]({u})" ...)`, instead of calling the vault writer's own formatting. If the writer's format changes, the test goes red for every note even when nothing is stale. Calling the renderer in vibemap/vault.py (one helper per concept) and asserting that each note exists would make it exact.
'''

