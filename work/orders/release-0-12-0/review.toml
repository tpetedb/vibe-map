Round 3, on the two edited lines only (the rest of the section is unchanged from round 2 and its ruling stands):

Added, Galaxy line 1, new parenthetical: "(with Settings, Vault set to Grow and no topic done, the first lesson can stay locked until 0.12.1; Vault set to Full shows it)". True of 33252df's own code, not of a later fix: `vaultMode()` in src/game/60-vault.js reads Settings > vault (falling back to config/camp.toml's [vault].mode, default "full"); `computeUnlocked()` returns every note when the mode is not "grow", and in "grow" mode starts from ALWAYS_NOTES plus, for shelves the player wants, only each shelf's depth-1 topics (`if(typeof TREE!=="undefined"&&!interestsAll())... t.d===1`), so with no stop claimed yet and interests not narrowed (`interestsAll()`), no topic note is unlocked. `galaxyTopic` -> `openTopic` -> `openNote` -> `vrender` calls `noteLocked(id)`, which for an unlocked-set miss renders the card "Not unlocked yet: finish the stop, meet the mentor or inspect the artifact that leads here." instead of the note. That is exactly the "can stay locked" the line claims (hedged, not "always locked", since a player whose interests include that shelf gets the depth-1 head start and would see it). Vault = Full skips computeUnlocked's grow branch entirely, so "shows it" is unconditionally true there. The fix that removes the caveat exists as a separate, unmerged branch (`claude/galaxy-grow-first-lesson`, commit 7654b6a, "so Grow opens the next topic instead of a lock (#209)"); `git merge-base --is-ancestor 7654b6a HEAD` and `...origin/main` both fail, so it is not part of 33252df or main, and "until 0.12.1" correctly places the fix in a future release rather than claiming it here.

Changed, safe-copy line, reworded from "a test keeps any learner-facing copy from asking for an approval again" to "a test checks the learner-facing text it scans for an unguarded instruction to approve a permission prompt". Read tests/test_safe_copy.py in full: `_learner_files()` walks game/vibe-map.html, docs/SYLLABUS.md, docs/site/syllabus.html and every src/ and vibemap/data/ text file (skipping vendor/pets); `unsafe_sentences()` flags a permission-mentioning sentence only when it matches `_APPROVE` ("answer/say/click/press/type/reply/hit yes/y/allow/accept", or "approve/accept/allow it/them/the prompt/the request/everything") and is not preceded by a `_GUARDED` phrase ("before you", "do not", "never", "only after you", ...). The new wording is the more accurate of the two: it names the actual mechanism (an unguarded instruction to approve, not literally "any... asking for an approval") and matches `test_the_detector_catches_the_old_instruction_and_passes_the_new_one`, which is built to accept a guarded "ask Tom before you say yes" and reject an unguarded "answer yes". Reads a little dense but is plain, accurate prose, no em dash, and does not repeat anything else in Changed.

