[[findings]]
severity = "low"
file = "tests/test_game_qol_feedback.py"
text = """
The PR run's qol-feedback shard is red, 1 failed and 42 passed. `test_a_hidden_page_stops_the_island_clock_and_comes_back_to_it` got `assert 10.5961 == 10.5837` on the read right after un-hiding. That is a race in the test: `until()` is `wait_for_function`, which polls on animation frames, so one game frame can land between `hidden === false` and the read of `t`. It is not the split. I ran the test alone four times after a browser slot came free: 4 of 4 passed. It did not fail in main's or K2's old-layout qol runs, and it runs on its own page fixture. The shard needs a rerun of the failed job to go green before landing. The test fix belongs to the test's owner, as a follow-up: read `t` in the same evaluate that sees `hidden === false`, or allow a single frame there.
"""

