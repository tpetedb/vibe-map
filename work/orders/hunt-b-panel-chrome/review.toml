[[findings]]
severity = "medium"
file = "src/body.html"
text = """
aria-modal="true" says something the panel does not do. The name is right and reaches the tree: \
Playwright reads '- dialog "Camp panel"' in Chromium and WebKit for the Roadmap, a stop, Settings \
and the Backpack, and Chromium's accessibility tree over CDP has name 'Camp panel', modal true. \
But focus is not confined: fourteen Shift+Tab presses from Close went zoom-out, zoom-fit, \
zoom-in, 'Inspect the cafe' (all four behind the panel), then More, World, Tree, Vault, Stats, \
Ask, Backpack, Roadmap, Search and the name pill, and never came back into the panel. The \
stylesheet says the HUD stays usable over an open panel on purpose. So the pull request's 'the \
contract the panel already keeps for the keyboard' is not so, and MDN's page on aria-modal is \
plain about this case: a dialog with no inert background and no confined focus omits the \
attribute or sets it false. It costs something here: the toast live region now lives in #hud, \
outside the dialog that claims the page, and a batch import raises its messages while the panel \
is open. Chromium still exposes the HUD buttons; VoiceOver is the reader that takes aria-modal at \
its word, and I could not run it. Either the panel becomes modal (openSheet() in 40-sheet.js, \
with the name per screen) or the attribute waits for that order."""

