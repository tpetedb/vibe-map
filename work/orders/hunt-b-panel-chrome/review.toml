text = """
Main moved under B7 and the order's own tests are red on the commit under review. origin/main is \
cb03e8b since pull request 163 (hunt F), where runDemo() in src/game/16-artifacts.js appends each \
line with el.append() so that a live region does not read the transcript again. TERMINAL takes \
'[...el.childNodes].find(n => n.nodeType === 3)', which is now the first line only. CI tests the \
merge with main, so run 35596561161 has test_a_demo_step_starts_at_the_column_and_a_fold_is_set_in \
red on all three surfaces (one step, 'you (Amsterdam)  ->  POST /v1/me', where five are asked) \
and test_the_sentence_a_demo_ends_on_is_read_whole red on all three ('the sentence fits, so this \
proves nothing', the step being 'fountain:  HIT    3 ms'). Reproduced in a scratch clone: merge \
origin/main, rebuild, the same six fail with the same words. The stylesheet is not at fault: with \
the element normalised first, the merged tree draws one line start per step on all 18 cases and \
nothing leaves the box. The reader has to walk every text node of #art-term, or take its ranges \
over the element, and the branch needs just sync-main before anything else: main only takes \
up-to-date pull requests, so this is what landing looks like."""

[[findings]]
severity = "high"
file = "src/style.css"
text = """
'The message just raised is always whole' holds only while the room is taller than the message, \
and the room is a fixed sum. Three places where it is not. \
One, CI, on this commit: test_a_full_stack_is_bounded_and_moves_nothing is red on the WebKit \
iPhone, default and larger-left. Under the runner's fonts the four numbers wrap to two rows on a \
fresh save (card y 193.6) and the widest message is 298.5 tall in a box of 280.4, so the newest \
card is cut and the island reads through its faded end. Here the card is 277.7 in 317.2. The \
fonts are system-ui, so every machine has its own answer, and this test has 39.5 px of this \
Mac's: about two lines of a bottle lesson, which the test reads out of items.json, so the content \
team can turn it red from another file. \
Two, a real iPhone-sized window after a real import: the bar wraps to 185.6, the room is 280.4, \
the widest message 277.7, whole by 2.7 px with its 'Read the topic' link inside the fade (my shot \
branch_iphone_normal_left_b3_fill_after_import). \
Three, Map size Compact, a row in Settings that main supports on a phone (touch-action:pan-y is \
written for it): the room is negative, the floor of 96 px binds, and the comment's 'never less \
than one card' is not true, because an ordinary claim is 117.8 px tall at half width on both \
phones. The only message on screen reads 'You delivered your first stop. Unlocked: the head' and \
ends there in the fade (brk_branch_iphone_compact_right_one); left-handed the same 96 px lie on \
zoom-in, by 6.4 on the Pixel and 41.7 on the iPhone, and on Enter on the iPhone. The same at 320 \
wide. On main that player read the whole message, over the HUD. So for them B2 trades a covered \
bar for a message that cannot be read to its end, and the changelog does not say so. \
Either the newest card sets the floor, so it is whole and lies over a button when it must, which \
is what the comment argues for, or the card gets more of the row on a phone so it is shorter, or \
toast() drops the oldest until the newest fits, which is the other order. The test should then \
hold with the bar wrapped, which is what a player with progress has."""

