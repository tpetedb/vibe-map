[[findings]]
severity = "high"
file = "tests/test_game_hunt_b.py"
text = """
Pull request 157 is red on this order's own test, on the commit under review: \
test_a_toast_on_the_island_leaves_the_map_alone[android] timed out in the smoke shard (run \
35568062009, job 106233739261, 80 s in the test, 20 s waiting for '#toast .tst'), and smoke has no \
retry, so main cannot take it. The shape is a race on a clock: the signpost toast fires once \
(lastSay) when the walker is 2.6 from the plot, walk_to() goes on to 1.6 and only then does the \
test start looking for an element that removes itself after 5000 ms. Here the gap is 0.7 to \
1.6 s, so it passes; on the runner it did not. _claim_the_first_stop and the batch test have the \
same shape: wait_for_selector, then until(SETTLED), then the measurement, all inside one toast's \
five seconds, with software WebGL drawing the spring. src/game/18-avatar.js says it in its own \
comment ('looking for the element is a race on a loaded machine') and offers window.__toasts() \
for the wait; the module docstring here says nothing waits on a clock. The measurement needs a \
message that is still there, so the wait has to stop the timer or not depend on it (the page \
clock, or a stack the test fills for the geometry with the real path kept for the count). AGENTS \
test loop rule 6."""

