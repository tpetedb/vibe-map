[[findings]]
severity = "medium"
file = "src/style.css"
text = """
The fade added in round two takes the blur off every card, and it is switched by a count that is \
wrong on every surface. '#toast:has(.tst:nth-child(4))' puts a mask on the stack; a masked \
element is the backdrop root of what is inside it, so each card's backdrop-filter: blur(8px) has \
nothing of the page left to blur and the card is only rgba(10,10,10,.78). Over the island that \
is a look. Over an open panel it is the message: on the Pixel and on the WebKit iPhone, with four \
cards over workstream 1, 'You delivered your first stop.' runs through 'The Innovation Hub' and \
the lesson's paragraphs read through all four cards; with two cards (no mask) the same spot is \
clean (my shots p5_android_2 against p5_android_4, p5_iphone_4). The real path is B3's own: the \
import is pressed in the Roadmap, so the seven messages come up over the Roadmap, and on a phone \
they cannot be read (b3open_branch_android). On main the same seven were readable and sat on the \
HUD, Close and Import; now they sit clear of the HUD and Close and cannot be read. A bound \
that keeps the controls clear and loses the words is half a fix. \
The count: on the desktop four cards fit (342 of 360, scrollHeight equals clientHeight) and the \
oldest is faded all the same, which the comment above the rule says must not happen. On a phone \
the bound is reached by three ordinary messages (3 x 117.8 plus gaps is 369 against 340.8 on the \
iPhone) and by two real ones: the longest bottle lesson (246 characters and its link) is 277.7 px \
tall at half width on the iPhone, 260.3 on the Pixel, against 152.5 on main, and one pickup after \
it cuts 75.6 px off its top (34 on the Pixel), which is the whole title, with a hard edge \
because there is no fourth child (shot p4_branch_iphone_bottle_pickup). So the fade is absent \
where a card is cut and present where none is. Either the oldest card leaves whole, or the cut is marked by something \
that does not mask the stack, and the rule follows overflow rather than a count."""

