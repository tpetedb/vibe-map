B7, .term: white-space:pre is applied to the one element all 74 artifact demos print into \
(#art-term), and most of what they print is not columns. Counting a line with no column gap as \
a sentence, 88 of the 157 transcript lines longer than 44 characters in ART_DEMOS \
(src/game/16-artifacts.js) are sentences, the lesson of the demo. Measured on the fountain, 'Fill it \
again', 115 characters: at 1440x900 with default settings 80 fit and 35 are hidden ('...The \
prompt cache keeps the st'), on the Pixel 7 71 are hidden, on the iPhone 74; on main the same \
line wraps and reads whole (shots main_prose_desktop and branch_prose_desktop in my scratch). \
23 demos in 16 of the 21 artifacts end in a sentence longer than the desktop box, 68 of 74 in one \
longer than the Pixel's. There is no scrollbar to say so on macOS or a phone and the pre takes no \
focus (no tabindex), so a keyboard cannot bring the rest in. The test locks this in: it asks for \
drawn == lines on the data centre only, which also forbids the other remedy the finding names, a \
hanging indent. Keep the columns whole without taking the sentences away, and test a demo that \
ends in one."""

