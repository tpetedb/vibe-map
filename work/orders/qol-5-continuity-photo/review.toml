verdict = "fail"
evidence = """The file runs green in the builder's cache, but it does not prove its sentence. (1) My own full run of tests/test_game_qol_continuity.py on the identical build (tools/build.py output cmp-equal to the branch) failed test_a_sitting_nobody_is_at_earns_no_card; rerun alone it failed 1 of 5 and 1 of 4, so about 3 in 10. It is a race: the Resume click is a pointerdown, so a 3 s break check can land between resume() and window.__breakAway(), show the card and write S.breakAt, and then __breaks().due is false (line 258). The test above it names exactly this race and switches breaks off to avoid it; this one does not. (2) Mutations in a scratch copy: removing `if(savedOn)return;` fails the mark test (54 - 4 <= 1); removing `S.exportedAt=Date.now()` fails the export test; removing the sheet check from breakClear() fails the between-stops test. Removing `renderer.render(scene,camera)` from photoTake() does NOT fail test_photo_mode_hides_the_hud_and_takes_the_drawn_frame: the captured scene area is then one flat colour (1 colour above the caption band in Chromium and in WebKit, against 908 and 720 on the real build), and the test still passes because the caption gradient and its anti-aliased text alone give more than 24 colours. So the same-frame capture, the one risk proposal 27 names, is not held by a test that was seen failing."""

