text = """A second saved mark for a concept another accepted order already owns. qol-4-feedback-companion (PR #164, accepted, waiting for its train car) built 'the save() tick from 24' (its findings.md, line 7): savedTick() in 18-avatar.js, raised from save(mark) in 00-state.js, with window.__saved = {n, on}. This order builds a second mark beside the stop dots, redefines window.__saved as {on, raised}, and wraps save with `save=function(){saveRecord();...}`, which drops batch 4's `mark` argument, so every save(false) batch 4 kept quiet would raise a mark again. In a scratch clone merging feat/qol-batch4 with 2d0d04a and rebuilding, the game carries both marks and both seams (the later one wins), and batch 4's test_a_claim_shows_the_saved_mark_and_takes_it_away_again and test_the_mark_is_throttled_because_save_is_called_constantly fail with TypeError on window.__saved().n. Whichever of #164 and #195 lands second breaks. One helper per concept: keep one mark (batch 4's, which is in 00-state.js where the proposal put it), have this order hook only the export line onto the write, and agree it on #127 with the state manager."""

