[[findings]]
severity = "high"
file = "tests/test_origins_code_git.py"
text = """The PR's CI is red at the reviewed commit. Run 35948802425, job 'lint, unit tests, generated files in sync' ends '5 failed, 892 passed'. I reproduced it locally with uv run pytest tests/test_origins_code_git.py tests/test_origins_ship_docs.py.

The two origins registries on main list every topic of their shelves. The craft pack adds topics to those shelves and adds no rows:
- test_origins_code_git.py: NAMES has no row for testdoubles, fixtures, properties, refactoring, buildersec or codereview. It pins len(NAMES) == 15. ACTORS has no python-software-foundation.
- test_origins_ship_docs.py: NAMES has no row for delivery, containers, manifests, iac, observability, incidents, supplychain or licences.

The failing tests are:
- test_the_table_covers_exactly_the_topics_of_these_shelves
- test_every_topic_has_one_primary_origin_whose_line_names_it (KeyError testdoubles)
- test_a_line_at_an_address_names_who_is_at_that_address
- test_the_three_shelves_hold_the_topics_this_order_sourced
- test_the_primary_line_of_every_topic_names_the_topic (KeyError delivery)

Both files are outside owns (tests/ is shared), and c1 does not run them, so work-check stays OK while CI fails. The manager has to widen owns, or scope those registries to their own packs. Then the rows have to be written to the rules those files enforce: a word that names the topic in the primary line, and the actor for an addressed place."""

[[findings]]
severity = "medium"
file = "vibemap/data/topics/craft/fixtures.toml"
text = """A correct run of the fixtures and properties hands-ons is red in this repository.

- Both try_its run 'pytest -q ... > out.txt'. Inside workspace/topics/<id>/, pytest takes the root pyproject.toml, whose addopts is '-q -ra'. That makes -qq, which prints only the progress line.
- In a scratch copy of 75f2054 I wrote test_cart.py and test_props.py per the try_its. The runs exited 0, and pytest-out.txt and props-out.txt hold only '....  [100%]'.
- vibe check --topic fixtures fails with 'pytest-out.txt does not mention: 4 passed', and properties fails the same way.
- The same files are green in a fresh `vibe new` camp, so whether the check passes depends on pytest configuration it does not control.
- tests/test_topics_craft.py runs pytest in tmp_path, outside the repository, so it never sees this. The rule is to test the entry point, not the mechanism.

The same applies to properties.toml. Make the try_it independent of any ini: '-o addopts=' works, or a command without -q with a check that allows for it. Add one test that runs the exercise inside workspace/topics/<id>/ of a camp that sets addopts."""

