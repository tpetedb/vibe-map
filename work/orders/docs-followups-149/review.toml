file = "docs/adr/0001-single-file-game.md"
text = """
"inside the one wrapping function only function declarations are hoisted" is not how JavaScript works: let and const are hoisted too, into the temporal dead zone, and var is hoisted as undefined. The constraint the build.py comment states is the accurate one: consts are not initialized until their line runs. The source list also leaves out src/errors.js and src/icon.svg, which the build reads.
"""

