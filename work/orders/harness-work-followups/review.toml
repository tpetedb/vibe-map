[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
changed() still hands the uncommitted names to git as pathspecs, and W2's fix now shows it. An untracked `:(nope)x.js` was judged on main (`STRAY :(nope)x.js`, exit 1); here `check` ends with exit 2 and `fatal: Invalid pathspec magic`, and test_a_diff_that_cannot_run writes that down as the expected behaviour for a legal file name. Worse spelled: a folder `:!src/` with scene.js in it reads as an exclusion, so a modified src/scene.js next to it drops off the list, on main and here alike (still NOT OK, because the odd path is itself a stray). `git --literal-pathspecs diff --name-only HEAD -- ':!src/scene.js' ':(nope)x.js' src/scene.js` exits 0 and prints src/scene.js. Fail closed both ways, so it opens no landing; CI never reaches it, a runner's tree is clean.
'''

[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
In touched.json newest means first edit, not last. Builder B edits, then thirty-one other agents make their first edit under the same order while B keeps editing between each of them: at the thirty-third agent B is dropped, and a stop by B right then is exit 0 on a failing order. B's next edit puts it back and the stop is exit 2 again, so what it takes is thirty-two new agents between a builder's last edit and its stop, and what it costs is one reminder. The docstring of _remember says as much; the comment at TOUCHED_KEEP, `holds every agent that could still be running`, promises more than the code does. Moving an agent to the end when it is found in the older half would close it without a write per edit.
'''

[[findings]]
severity = "low"
file = "docs/adr/0016-work-orders.md"
text = '''
