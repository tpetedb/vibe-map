[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
For a follow-up; none of these opens a landing, because each is caught once the change is committed and CI judges commits. The new rule in changed() compares the working tree with base, not the index: with a stray staged and the working copy put back (`MM vibemap/pet.py`), `work.py check` prints OK; after `git commit` it prints `STRAY vibemap/pet.py`. The same function calls git() without must: an untracked file named `:(bogus)x` makes `git diff origin/main -- ...` fail with `fatal: Invalid pathspec magic`, the failure reads as nothing differs, and a tracked uncommitted stray next to it drops off the list (the odd file is itself reported, so the check is still NOT OK). Names git quotes even with quotepath off are read without -z there: an untracked or staged `vibemap/a"b.py` is no stray until it is committed. I tried the rule as asked and found no other way round it: a stray during a merge, and one on top of a file that arrived from main, are both caught.
'''

