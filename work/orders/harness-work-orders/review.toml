[[findings]]
severity = "high"
file = "tools/work.py"
text = '''
This order's review lapses the moment it is committed, so this pull request can never pass its own gate. contribution() diffs `owns` plus order.toml, this order owns `work/`, and review.toml and signoff-docs.toml live under it. In a clone of this branch ($TMPDIR/wo2-self, origin/main set to 1cc63b8) I set `reviewed` to c0ed11241ce6c5426c3905d14d831cc152f76f6e: uncommitted, `load_review` answers `improve`; after `git commit` it raises `the order or a file it owns changed after the reviewer looked; review again and update reviewed`, and `work.py ci --head chore/work-orders` prints the same. The first version exempted the order's folder; the new one should exempt everything in it except order.toml. No test has an order that owns its own folder, and the one order in the repository does.
'''

[[findings]]
severity = "high"
file = "tests/test_work.py"
text = '''
CI is red on this commit and c1 and c4 pass only on the builder's machine. `test_ci_finds_the_order_by_its_branch_and_wants_review_and_sign_off` and `test_the_commands_run_end_to_end` run `python tools/work.py` inside a scratch repository; importing sync_main writes tools/__pycache__/, the scratch repository has no .gitignore, and dirty() reports the .pyc as a stray. Here ~/.gitignore_global hides it. Reproduce: `GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null uv run pytest -q tests/test_work.py` gives 2 failed. CI run 35543970777, step 13: `FAILED tests/test_work.py::test_ci_finds_the_order_by_its_branch_and_wants_review_and_sign_off - AssertionError: work: one: tools/__pycache__/sync_main.cpython-312.pyc is outside what it owns`, `FAILED tests/test_work.py::test_the_commands_run_end_to_end`, `2 failed, 539 passed`. The moved work step (14) was skipped, so it has never run on a runner.
'''

[[findings]]
severity = "medium"
file = "tools/work.py"
text = '''
The patch id has a false pass: `git patch-id` ignores whitespace. In $TMPDIR/wo2-pid an owned tools/guard.py held `if x:` / `audit(x)` / `return False` / `return True`; review and sign-off accepted. After them I dedented `        return False` to `    return False`, so may() always returns False, and committed: `work.py accept` still printed `checked, reviewed, signed off. Ready to land.` The same holds for re-indenting a step in ci.yml or a block in a justfile. `--verbatim` closes it. Controls behave: an edit, a replaced binary, chmod +x and a loosened order.toml lapse the review; a clean merge of main that touches line 1 of an owned file keeps it.
'''

[[findings]]
severity = "medium"
file = "tools/work.py"
text = '''
touched.json holds only an agent that wants to be held. With a failing order in $TMPDIR/wo2-h: sub-1 edits through the Edit tool, is recorded as builder, and its stop exits 2 with `FAIL c1` although its closing text is not the report; that part works. Three ways out, each `hook stop` exit 0: sub-2 edits only through Bash and is never recorded; sub-1 overwrites touched.json with `{}` (the file is in its own order folder, so the edit hook allows the Write); sub-3 appends one broken line to order.toml, after which the edit hook lets an Edit of vibemap/cli.py through, nothing is recorded, and even a first line `order: first-order` is not held because a draft is not active. check, accept and CI still refuse the result, so this opens no landing; but README and CLAUDE.md say an agent that worked on an order `cannot stop while it fails`, and that is only true of a cooperative one. Honouring the cache in `hook stop` is acceptable on the same ground: the hold is advice, accept measures.
'''

[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
Identity makes the hold per session, and Stop fires at the end of every turn. A main session that once used Edit under an order (`{"session_id":"main-1"}`) ran every criterion again at each turn end in which the tree had changed, and was blocked once per turn while the order failed: 3s each in the scratch repository with `sleep 3`, about 130s for this order (c1 8.0s plus c4 123.5s in the packet). touched.json is never pruned. For a builder subagent it fires once, which is the case it was built for.
'''

[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
Left from the first review, and the ADR now says all sixteen are fixed, each with a test. Still open: a JSON list, null, a string tool_input or a numeric file_path in a hook event end in a traceback (exit 1); `belongs to team None` for a path no team covers; `thread` never prints the issue's own text; MEMBER is not push access; the Stop timeout is 1800s against four criteria of up to 1500s; landed() counts a review whose verdict is improve; on Python 3.9 the hooks are now silently off (exit 0, no message). New and small: a sign-off's `team` key is never read and `by` may be the reviewer (`team = "scene"`, `by = "rev"` in signoff-docs.toml passed ci); two orders on one branch are both guarded by the hook but each fails the other's `check` as strays, and validate says nothing; `ci` without `--head` finds 0 orders for a build that leaves the folder alone, so the fix lives in one line of ci.yml.
'''

[[findings]]
severity = "low"
file = ".github/workflows/ci.yml"
text = '''
A fork's pull request, as asked. The step is safe to run: the branch names arrive through env, `--head '--base=HEAD'` ends in an argparse error with exit 2, ci executes no criterion (a check that appends to a file ran 0 times under `work.py ci`), and the job has `contents: read`. It is not a gate against a fork: `pull_request` runs the fork's own tools/work.py, `by` is free text, and a pull request that carries no order is left alone. That is the trust the ADR states; it belongs there in so many words.
'''
