[[findings]]
severity = "high"
file = "tests/test_work.py"
text = '''
CI is red on this commit, and the work step has still never run on a runner (step 14 skipped in runs 35542270516, 35543970777 and 35544887851). `test_ci_finds_the_order_by_its_branch_and_wants_review_and_sign_off` calls `work.py ci --base origin/main` without --head and expects the scratch repository's branch `main-plan` to be found; cmd_ci reads `a.head or os.environ.get("GITHUB_HEAD_REF") or` the current branch, and on a pull_request runner GITHUB_HEAD_REF is `chore/work-orders`, so the tool answers `0 orders in this pull request, 0 problems`. Reproduce: `GITHUB_HEAD_REF=chore/work-orders uv run pytest tests/test_work.py` gives `1 failed, 59 passed`. It is the same kind of defect as last round, a test that reads the machine it runs on, from the other side: the autouse fixture clears the git configuration and not the runner's variables. c1 and c4 cannot pass in CI until it is fixed, and I will not accept a gate whose own CI step nobody has seen run.
'''

[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
contribution() reads the diff with text=True. An owned text file that is not UTF-8 (`printf 'caf\xe9\n' > src/body.html`, Latin-1, no NUL byte, so git diffs it as text) ends `work.py accept` and `work.py ci` in a traceback, `UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9`, exit 1, and the stop hook prints `work hook let go: UnicodeDecodeError`. It fails closed and no tracked file here is like that today (I scanned all 649), so it costs a confusing message, not a wrong answer; bytes through to patch-id would end it.
'''

[[findings]]
severity = "low"
file = "tools/work.py"
text = '''
cmd_ci carries a landed order by its branch name until a release sweeps it. In a scratch repository body-order landed (`landed: {'body-order'}`); a new branch with the same name that edits src/head.html then gets `work: body-order: src/head.html is outside what it owns`, exit 1. carried should leave out landed(). Also small: _remember() still records session ids that hook_stop no longer reads (`{"sub-1": "builder", "s1": "builder"}`); a stop-hook run that hits its budget writes `timed out after 1s` rows into result.json, which board and post then show as FAIL; any file named signoff-<anything>.toml in the order's folder is exempt from the currency check, not only those of the cross teams.
'''

