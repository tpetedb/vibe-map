id = "release-0-11-0"
statement = "0.11.0 goes out: the twenty-nine changelog fragments on main are assembled into one dated section that reads as one changelog, the version is 0.11.0 everywhere a tool reads it, and every picture under docs/media is rendered from the product as main has it rather than from an older one. The last red thing the nightly suite still reports, a world feed that answers with nothing new at a weekend, is fixed at the source first, so the release goes out on a green night."
