# The slow end of the battery: everything marked `integration`. It runs once a
# night, on every release tag, and on demand from the Actions tab, so ci.yml
# stays a few minutes on a pull request while these two runs still gate a
# release. A red night is a bug report, not a blocked merge.
name: nightly

on:
  schedule:
    # 03:00 UTC, after the news pull and well before anyone reads the result.
    - cron: "0 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

# A night and a tag are both a record, so nothing here is ever cancelled; the
# group only stops two runs of the same ref from overlapping.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.x"

jobs:
  fresh-camp:
    name: a camp from nothing, with the installed command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # The point of this job is the package a learner installs, not the
      # checkout: `vibe` comes from a wheel built here and put on PATH.
      - name: Install vibe from the checkout
        run: |
          uv tool install .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: vibe --version
      # `vibe new` makes the camp's first commit, which needs an identity.
      - name: Give git an identity for the camp's first commit
        run: |
          git config --global user.name "vibe ci"
          git config --global user.email "actions@users.noreply.github.com"
      - name: vibe new, the checks that refuse, the checks that pass, the code
        run: python3 tools/fresh_camp.py

  # The registry is only as good as the feeds in it. This is the one job that
  # is allowed to reach the open internet; a source that stops answering is a
  # red night, which is a bug report against vibemap/data/sources.json.
  feeds-alive:
    name: every registered feed answers and parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run pytest -m integration tests/test_news.py

  # The one job left on macOS, and it runs on a release tag only. The product
  # is written for a MacBook, so a tag says the installed command still makes a
  # camp on the machine a learner actually has. Five macOS jobs at once is the
  # whole pool for a Pro account, which is why this is not on every push.
  macos-smoke:
    name: the installed command on a Mac (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install vibe from the checkout
        run: |
          uv tool install .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: vibe --version
      - name: Give git an identity for the camp's first commit
        run: |
          git config --global user.name "vibe ci"
          git config --global user.email "actions@users.noreply.github.com"
      - name: vibe new, the checks that refuse, the checks that pass, the code
        run: python3 tools/fresh_camp.py
      # A test that is genuinely macOS-only carries the `macos` marker and
      # skips itself everywhere else, so this job is the only place it runs.
      # There are none today, and exit code 5 is pytest for "nothing selected".
      - run: uv sync --frozen
      - run: uv run pytest -m macos || test $? -eq 5

  playthrough:
    name: every island, every stop, every mentor, the finale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - id: pw
        name: The resolved Playwright version
        run: >-
          echo "version=$(uv run python -c
          'import importlib.metadata as m; print(m.version(\"playwright\"))')"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m integration tests/test_game_playthrough.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-screenshots
          path: tests/out/
          if-no-files-found: ignore
