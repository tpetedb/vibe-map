# Keep the game current: pull the world feed every day and propose a reviewed update.
# data/news.json is embedded into the game at build time and copied to
# game/news.json, which the hosted game fetches at runtime, so the game is
# rebuilt and committed too (Pages redeploys on that); vault/Camp/News.md is
# the same list as a note. Run by hand from the Actions tab when you want it
# now. The sources are vibemap/data/sources.json; a source that stops
# answering shows up in the note under "Feeds that did not answer".
name: news

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-news-publish
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run vibe news
      - run: uv run python tools/build.py
      # Keep a recoverable snapshot even when branch or PR publication fails.
      - uses: actions/upload-artifact@v4
        with:
          name: news-snapshot
          path: |
            data/news.json
            game/news.json
            vault/Camp/News.md
            game/vibe-map.html
          if-no-files-found: error
      - name: Propose the news update
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python tools/publish_news.py
