# Keep the game current: pull the world feed every day, commit the result.
# data/news.json is embedded into the game at build time and copied to
# game/news.json, which the hosted game fetches at runtime, so the game is
# rebuilt and committed too (Pages redeploys on that); vault/Camp/News.md is
# the same list as a note. Run by hand from the Actions tab when you want it
# now. The sources are vibemap/data/sources.json; a source that stops
# answering shows up in the note under "Feeds that did not answer".
name: news

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run vibe news
      - run: uv run python tools/build.py
      - name: Commit when something changed
        run: |
          git config user.name "vibe news"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json game/news.json vault/Camp/News.md game/vibe-map.html
          git diff --cached --quiet && exit 0
          git commit -m "News: daily pull of the world feed"
          git push
