# Keep the game current: pull the AI feeds every Monday, commit the result.
# data/news.json is embedded into the game at build time, so the game is
# rebuilt and committed too (Pages redeploys on that); vault/Camp/News.md is
# the same list as a note. Run by hand from the Actions
# tab when you want it now.
name: news

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run vibe news
      - run: uv run python tools/build.py
      - name: Commit when something changed
        run: |
          git config user.name "vibe news"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json vault/Camp/News.md game/vibe-map.html
          git diff --cached --quiet && exit 0
          git commit -m "News: weekly pull of the AI feeds"
          git push
