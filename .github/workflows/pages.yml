# Publish the game to GitHub Pages on every push to main (workstream 7).
# The site is the game/ folder: one HTML file, no build step on the runner
# because game/vibe-map.html is committed already built. Enable Pages once in
# the repo settings with source "GitHub Actions"; after that this workflow
# owns the URL.
#
# site/ is committed and holds what the game itself does not carry: the page a
# missing path lands on. The copies below add the built game and its two
# runtime files to it. The learner's own workspace/game/index.html is not
# published here: in this checkout it is the untouched stub, and a public page
# telling a stranger to open their agent in "this folder" helps nobody.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "site/**"
      - "docs/site/**"
      - "docs/media/hero.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Make the game the front page
        run: |
          mkdir -p site
          cp game/vibe-map.html site/index.html
          cp game/vibe-map.html site/vibe-map.html
          # The runtime feed, next to the page: the game fetches ./news.json
          # from its own origin and never from a third party.
          cp game/news.json site/news.json
          # The written course, generated from docs/SYLLABUS.md and the package
          # data by tools/gen_syllabus.py. One file, no third-party request.
          cp docs/site/syllabus.html site/syllabus.html
          # The share card the page's og:image points at. Nothing in the game
          # loads it; a crawler does, so it has to be on this origin.
          cp docs/media/hero.png site/hero.png
          # 404.html is served for any path under the site, so its way home
          # cannot be a relative link: base_path is this site's own root
          # ("/vibe-map", or empty on a user page), whoever published it.
          sed -i 's|{{BASE}}|${{ steps.pages.outputs.base_path }}|g' site/404.html
          if grep -q 'BASE' site/404.html; then
            echo "the 404 page still has an unfilled link home" && exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
