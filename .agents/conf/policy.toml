# The floor no profile or overlay lowers (DECISION #193 section 3). harness.py
# sync renders it into .claude/settings.json. Hooks remind; these rules and the
# sandboxes decide.
# The deny rules for .agents/conf, .agents/hooks, .agents/utils, the lock and
# the rendered outputs come with the hook dispatcher, which proves them.
version = 1

[claude]
# Secrets are never read, a push is never forced. Deny beats every allow and
# every hook (F027).
deny = [
  "Read(./.env)",
  "Read(./.env.*)",
  "Read(~/.ssh/**)",
  "Read(~/.aws/**)",
  "Read(~/.codex/auth*)",
  "Bash(git push --force:*)",
  "Bash(git push -f:*)",
]
# The knob file asks even in auto mode (F122).
ask = [
  "Edit(./config.toml)",
  "Write(./config.toml)",
]

[claude.sandbox]
# Off until the dispatcher order turns it on with the board root writable from
# a linked worktree; failIfUnavailable and allowUnsandboxedCommands come from
# the profile, so the floor is already in place the day it is enabled.
enabled = false

# Codex keeps its default protected paths (.git, .agents, .codex read-only,
# F079) and gets no tracked writable root: a relative one resolves from .codex/
# and is not a directory in a linked worktree, whose .git is a file, so it stops
# every shell tool there (A2 as amended on the #192 review). A launch that
# writes the board passes --add-dir with the absolute git common dir instead.
