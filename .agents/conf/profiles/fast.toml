# The fast profile lowers repeated work only: secrets, sandbox boundaries and
# CI never change with the profile. Complete, no inheritance.
version = 1
safeguards = "light"
runner = "native-sandbox"
network = "allowlist"
escalation = "on-request"
local_checks = "nearest"
review = { independent = 1, second = "deterministic" }
effort = "models"
mcp_servers = "from-conf"
loop = { blocks_no_progress = 2, blocks_max = 8, iterations = 25, wall_minutes = 60 }
context = { digest_max_chars = 6000, tool_output_max_chars = 8000, read_max_kb = 200, agents_md_chain_max_kb = 24 }
claude = { failIfUnavailable = true, allowUnsandboxedCommands = false, defaultMode = "acceptEdits" }
codex = { sandbox_mode = "workspace-write", approval_policy = "never" }
